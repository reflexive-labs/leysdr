# Example Moat configuration for working on leysdr in a Linux container.
# https://majorcontext.com/moat
#
# Moat is optional. docs/dev/setup.md, "Linux (including a Moat container)", says what a Linux
# container can build and test: the Go clients, the contract, the fixtures, and the engine and the
# app's client facade with a Swift 6.2 toolchain. The Mac app's views, the Accelerate kernels and
# real USB radios need macOS. Swift is not in Moat's dependency registry; install a Swift 6.2
# toolchain in the container yourself (setup.md has the recipe).

name: leysdr
agents: [claude]   # pick the agent you use

# Credentials are injected at the network layer, never as environment variables. Grants are per
# user: add the ones you have (`moat grant add github` on the host) and remove the rest.
grants:
  - github         # gh and git over https://github.com
  - claude         # the agent's own credential

dependencies:
  - go@1.27
  - protobuf         # protoc for `make proto` and `make proto-check`
  - golangci-lint    # `make lint`
  - go-extras        # gofumpt
  - git
  - gh

language_servers:
  - go

# Go caches outside the shared workspace, kept across runs.
volumes:
  - name: gomodcache
    target: /home/moatuser/go/pkg/mod
  - name: gobuildcache
    target: /home/moatuser/.cache/go-build

hooks:
  pre_run: |
    set -e
    cd go && go mod download

network:
  policy: permissive
  rules:
    # No repository or branch deletion from inside the container.
    - "api.github.com":
        - "deny DELETE /repos/*/*"
        - "deny DELETE /repos/*/*/git/refs/**"

snapshots:
  exclude:
    additional:
      - .build/            # SwiftPM
      - fixtures/*.cf32    # generated by `make fixtures`
      - fixtures/*.cu8
