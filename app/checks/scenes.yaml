    stage:
      place: radio
      inspector: true
      select_bookmark: Calling
      settle: 3
    app:
      - {cmd: state, expect: {window.width: 1000, window.min_width: 900, assistant_shown: false}}
      - {cmd: press, identifier: toolbar.assistant}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {assistant_shown: true, window.width: 1221, window.min_width: 1221}}
      - {cmd: snapshot, name: widened, mask: [spectrum, waterfall, readings, transmissions, log_day, heard, squelch, inspector]}
      - {cmd: press, identifier: assistant.input}
      - {cmd: type, text: show me 2 m}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 3}
      - {cmd: state, expect: {tuned_hz: 146520000, assistant.state: ready, zoom: 1, view_window.low_hz: 144960000, view_window.high_hz: 147840000}}
      - {cmd: press, identifier: assistant.input}
      - {cmd: type, text: show me 146.0 to 146.6}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 3}
      - {cmd: state, expect: {tuned_hz: 146520000, assistant.state: ready, zoom: 4, view_window.low_hz: 145940000, view_window.high_hz: 146660000}}
      - {cmd: snapshot, name: range, mask: [spectrum, waterfall, readings, transmissions, log_day, heard, squelch, inspector]}
      - {cmd: press, identifier: sidebar.bookmark.club-repeater}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146940000, view_window.low_hz: 146580000, view_window.high_hz: 147300000}}
      - {cmd: press, identifier: assistant.input}
      - {cmd: type, text: show me airband}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 3}
      - {cmd: state, expect: {tuned_hz: 146940000, assistant.state: ready, view_window.low_hz: 146580000, view_window.high_hz: 147300000}}
      - {cmd: snapshot, name: airband, mask: [spectrum, waterfall, readings, transmissions, log_day, heard, squelch, inspector]}
