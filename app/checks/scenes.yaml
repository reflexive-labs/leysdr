    steps:
      - ley: [stop, "146.52"]
      - ley: [bookmarks, add, "146.525", --name, Near]
    stage:
      place: radio
      inspector: true
      select_bookmark: Calling
      settle: 3
    app:
      - {cmd: state, expect: {tuned_hz: 146520000, bookmark: Calling, open_rows.0: 2m, focused: ""}}
      - {cmd: snapshot, name: open}
      - {cmd: ax, name: open}
      - {cmd: hover, identifier: sidebar.band.2m.channels, expect: {tooltip: "The 2 m amateur plan: pick a channel by name"}}
      - {cmd: hover, identifier: sidebar.outofrange, expect: {tooltip: "Show them; they lie outside what this radio tunes"}}
