  # scene_vhf20 holds 2 m, MURS, marine and NOAA WX2 in one 21 MSPS capture (docs/plans/app.md,
  # U4), so the window tunes across bands without moving the radio, and the sidebar offers each
  # band the capture holds. From Calling, a row opened by its chevron (marine) closes on a tune
  # into another row (MURS); a pick of MURS 4 by Return arrives at 20 kHz, where the band's
  # group is 11.25 kHz, and closes the picker. wx3 typed into the filter and Returned tunes
  # 162.475 MHz and clears and lets go of the field; and marine's rail shows no plan ticks.
  # A band sets a squelch it measures, which moves by a decibel between runs, so a terminal
  # sets one before each tree.
  - name: vhf-wide
    serial: true
    covers: [SidebarView.swift, BandRailView.swift, PlanPickerView.swift, InspectorView.swift,
      Sidebar.swift, Bands.swift, RetuneQueue.swift, bands.json]
    fixtures: [{name: scene_vhf20}]
    bookmarks: ../../site/shots/home.csv
    steps:
      - ley: [set, squelch, "off"]
    stage:
      place: radio
      inspector: true
      select_bookmark: Calling
      settle: 3
    app:
      - {cmd: state, expect: {tuned_hz: 146520000, band: 2m, open_rows.0: 2m}}
      - {cmd: snapshot, name: initial}
      - {cmd: ax, name: initial}
      - {cmd: press, identifier: sidebar.band.marine.chevron}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {open_rows.0: 2m, open_rows.1: marine}}
      - {cmd: press, identifier: sidebar.band.murs}
      - {cmd: wait, seconds: 2}
      - {cmd: state, expect: {band: murs-151, bandwidth_hz: 11250, open_rows.0: murs}}
      - {cmd: press, identifier: sidebar.band.murs.channels}
      - {cmd: wait, seconds: 1}
      - {cmd: type, text: "4"}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 2}
      - {cmd: state, expect: {popover: "", tuned_hz: 154570000, bandwidth_hz: 20000, band: murs-154}}
      - {cmd: ley, args: [set, squelch, "-50", --channel, "154.57"]}
      - {cmd: wait, seconds: 1}
      - {cmd: ax, name: murs}
      - {cmd: key, keys: cmd+g}
      - {cmd: type, text: wx3}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 2}
      - {cmd: state, expect: {tuned_hz: 162475000, band: noaa, filter_query: "", focused: ""}}
      - {cmd: press, identifier: sidebar.band.marine}
      - {cmd: wait, seconds: 2}
      - {cmd: state, expect: {band: marine}}
      - {cmd: ley, args: [set, squelch, "-50", --channel, "159.0125"]}
      - {cmd: wait, seconds: 1}
      - {cmd: ax, name: marine}
      - {cmd: snapshot, name: marine}

  # A sweep from start to end (docs/plans/app.md, U5 and U7), on scene_vhf20 with each sweep
  # held for 4 s (sweep_dwell). The fixture's channel is stopped first, so the window plays its
  # own. Scan band on the tuned 2 m row stops the audio, keeps the frequency in the field and
  # the row open with its words and Stop; Stop ends the sweep and the audio comes back on
  # Calling with nothing under the item. A sweep left to run comes back with its hits, and a
  # click on a hit's row and on a hit's tick tunes it, keeping the hits. A bookmark, a band and
  # a chart click during a sweep stop it and are done once the radio is back. Scan band on NOAA,
  # opened by its chevron while marine sweeps, stops marine and sweeps NOAA, whose row keeps its
  # hits. An AM bookmark comes back at AM after a sweep. With a recording running Scan band
  # asks first; Cancel leaves the radio alone and Sweep anyway sweeps. After Stop Listening,
  # Scan band on NOAA sweeps, selects the band and plays it.
  - name: sweep-lifecycle
    serial: true
    covers: [SidebarView.swift, BandRailView.swift, ChartMouse.swift, WaterfallView.swift,
      InspectorGroups.swift, LeylineApp.swift, Sweep.swift]
    fixtures: [{name: scene_vhf20}]
    bookmarks: ../../site/shots/home.csv
    sweep_dwell: 4
    steps:
      - ley: [stop, "146.52"]
      - ley: [bookmarks, add, "147.3", --name, Wide, --mode, am]
    stage:
      place: radio
      inspector: true
      select_bookmark: Calling
      settle: 3
    app:
      - {cmd: state, expect: {tuned_hz: 146520000, sink: own}}
      - {cmd: press, identifier: sidebar.band.2m.scan}
      - {cmd: wait, seconds: 1.5, expect_log: ["sweep: paused: channel", "sweep: job_.* started: 2 m amateur"]}
      - {cmd: state, expect: {tuned_hz: null, sink: none, open_rows.0: 2m}}
      - {cmd: hover, identifier: sidebar.band.2m.scan, expect: {tooltip: "Stop the sweep; listening comes back where it was"}}
      - {cmd: snapshot, name: sweeping}
      - {cmd: press, identifier: sidebar.band.2m.scan}
      - {cmd: wait, seconds: 2, expect_log: ["sweep: stop asked on 2 m amateur", "sweep: resuming bookmark Calling"]}
      - {cmd: state, expect: {tuned_hz: 146520000, sink: own, bookmark: Calling}}
      # Left to run, then its hits tuned by their row and their tick.
      - {cmd: press, identifier: sidebar.band.2m.scan}
      - {cmd: wait, seconds: 6, expect_log: ["sweep: job_.* ended: [0-9]+ hits?", "sweep: resuming bookmark Calling"]}
      - {cmd: state, expect: {tuned_hz: 146520000, mode: NFM, bandwidth_hz: 12500, sink: own}}
      - {cmd: click, identifier: sidebar.hit.146-940-mhz}
      - {cmd: wait, seconds: 1, expect_log: "tune: 1469[34][0-9]{4} Hz"}
      - {cmd: press, identifier: sidebar.bookmark.calling}
      - {cmd: wait, seconds: 1}
      - {cmd: click, identifier: rail.hit.146-940-mhz}
      - {cmd: wait, seconds: 1, expect_log: "tune: 1469[34][0-9]{4} Hz"}
      - {cmd: state, expect: {band: 2m}}
      # A bookmark, a band and a chart click during a sweep.
      - {cmd: press, identifier: sidebar.band.2m.scan}
      - {cmd: wait, seconds: 1}
      - {cmd: press, identifier: sidebar.bookmark.club-repeater}
      - {cmd: wait, seconds: 3, expect_log: ["sweep: tune bookmark Club repeater waits for the sweep to stop", "ended: cancelled", "!DEVICE_SWEEPING"]}
      - {cmd: state, expect: {tuned_hz: 146940000, bookmark: Club repeater, sink: own}}
      - {cmd: press, identifier: sidebar.band.2m.scan}
      - {cmd: wait, seconds: 1}
      - {cmd: press, identifier: sidebar.band.murs}
      - {cmd: wait, seconds: 3, expect_log: ["sweep: tune row MURS waits for the sweep to stop", "ended: cancelled", "!DEVICE_SWEEPING"]}
      - {cmd: state, expect: {band: murs-151, sink: own}}
      # A hit with no bookmark under its tick names itself and its level on hover.
      - {cmd: press, identifier: sidebar.band.murs.scan}
      - {cmd: wait, seconds: 6, expect_log: "sweep: job_.* ended: [0-9]+ hits?"}
      - {cmd: state, expect: {hits.0: "1", hits.1: "4"}}
      - {cmd: hover, identifier: rail.hit.1}
      - {cmd: state}
      - {cmd: press, identifier: sidebar.band.murs.scan}
      - {cmd: wait, seconds: 1}
      - {cmd: click, x: 804, y: 400}
      - {cmd: wait, seconds: 3, expect_log: ["sweep: tune to 15[0-9]+ Hz waits for the sweep to stop", "ended: cancelled", "!DEVICE_SWEEPING"]}
      - {cmd: state, expect: {band: marine, sink: own}}
      # Scan band on a second row while the first sweeps.
      - {cmd: press, identifier: sidebar.band.marine.scan}
      - {cmd: wait, seconds: 1}
      - {cmd: press, identifier: sidebar.band.noaa.chevron}
      - {cmd: press, identifier: sidebar.band.noaa.scan}
      - {cmd: wait, seconds: 7, expect_log: ["sweep: scan NOAA weather waits for the sweep to stop", "ended: cancelled", "sweep: job_.* started: NOAA weather", "sweep: job_.* ended: 1 hit"]}
      - {cmd: state, expect: {band: marine, sink: own, open_rows.0: marine, open_rows.1: noaa, hits.0: WX2}}
      # An AM bookmark keeps its mode through a sweep.
      - {cmd: press, identifier: sidebar.band.2m}
      - {cmd: wait, seconds: 1}
      - {cmd: press, identifier: sidebar.bookmark.wide}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {bookmark: Wide, mode: AM}}
      - {cmd: press, identifier: sidebar.band.2m.scan}
      - {cmd: wait, seconds: 6, expect_log: "sweep: resuming bookmark Wide"}
      - {cmd: state, expect: {bookmark: Wide, mode: AM, tuned_hz: 147300000}}
      # After Stop Listening, Scan band on NOAA.
      - {cmd: menu, menu: "Tune>Stop Listening"}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: null, sink: none}}
      - {cmd: press, identifier: sidebar.band.noaa.chevron}
      - {cmd: press, identifier: sidebar.band.noaa.scan}
      - {cmd: wait, seconds: 6, expect_log: ["sweep: job_.* started: NOAA weather, .* no capture to pause", "sweep: job_.* ended: 1 hit", "selecting NOAA weather after the sweep"]}
      - {cmd: state, expect: {band: noaa, sink: own, hits.0: WX2, notices.0: "NOAA weather: NFM at 12.5 kHz"}}
      # A recording on the window's capture: Scan band asks.
      - {cmd: press, identifier: inspector.record}
      - {cmd: wait, seconds: 2}
      - {cmd: press, identifier: sidebar.band.noaa.scan}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {alert.title: "Move the radio?", alert.buttons.0: Sweep anyway, alert.buttons.1: Cancel}}
      - {cmd: press, identifier: alert.cancel}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {band: noaa, sink: own, alert: null}}
      - {cmd: press, identifier: sidebar.band.noaa.scan}
      - {cmd: wait, seconds: 1}
      - {cmd: press, identifier: alert.sweep-anyway}
      - {cmd: wait, seconds: 6, expect_log: ["sweep: job_.* started: NOAA weather", "sweep: job_.* ended: 1 hit"]}
      - {cmd: state, expect: {band: noaa, sink: own, hits.0: WX2}}

  # A NOAA sweep with nothing on the air (docs/plans/app.md, U7), as with the antenna off:
  # scene_wx is the floor alone, so the row says nothing was heard and why, and the rail has
