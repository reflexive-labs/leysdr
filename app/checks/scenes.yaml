    stage:
      place: radio
      inspector: true
      settle: 3
    app:
      - {cmd: state, expect: {tuned_hz: 146940000, bookmark: Club repeater, sink: other, muted: false}}
      - {cmd: ley, args: [state], expect_stdout: ["!by app:Leyline", "147.180 MHz"]}
      - {cmd: snapshot, name: launched}
      - {cmd: ax, name: launched}
      - {cmd: daemon, op: stop}
      - {cmd: wait, seconds: 2}
      - {cmd: snapshot, name: stopped}
      - {cmd: daemon, op: start}
      - {cmd: wait, seconds: 6}
      - {cmd: state, expect: {tuned_hz: 146520000, sink: other}}
      - {cmd: ley, args: [ask, --yes, listen to the club repeater]}
      - {cmd: wait, seconds: 3, expect_log: "following chan_.*made by the assistant"}
      - {cmd: state, expect: {tuned_hz: 146940000, bookmark: Club repeater, sink: own}}
      - {cmd: press, identifier: transport.mute}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {muted: true, sink: none}}
      - {cmd: daemon, op: stop}
      - {cmd: wait, seconds: 2}
      - {cmd: daemon, op: start}
      - {cmd: ley, args: [tune, "147.18", --persistent, --no-audio]}
      - {cmd: wait, seconds: 6}
      - {cmd: state, expect: {tuned_hz: 147180000, bookmark: Evening net, muted: true, sink: none}}
      - {cmd: ley, args: [state], expect_stdout: "!by app:Leyline"}

