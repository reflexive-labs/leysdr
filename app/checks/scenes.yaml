  # The sidebar as the owner decided it (docs/plans/app.md, MC-1a, and the mockup
  # tmp/sidebar-actions-mock.png): the open 2 m row's Scan band and Channels as list rows at a
  # bookmark row's height, the glyph under the bookmark dots and the label under their names,
  # dimmer than a name, with no chrome, Channels ending in ›, and the header, range line, actions
  # and bookmarks on one raised ground. The range line ends `sq auto` while the daemon says the
  # channel's level was measured, `sq −45` once a terminal sets one, and its squelch is never cut.
  # Near, 5 kHz up from the calling channel, reads `≈ calling`; Club repeater shows no tone. The
  # fold reads `N bands out of range` and its help says where; GMRS, out of range, is disabled
  # (its row and Channels read disabled in the tree) with its help saying why, and its chevron
  # still opens it. Closing the picker by Escape or by a pick leaves nothing focused, so Space
  # mutes and → tunes. marine's picker is twelve rows of its 110, and 24 narrows them. An
  # accessibility press on a step arrow takes the band's step whatever key is held. A hit's row
  # and its ＋ use the plan channel's frequency when there is one; 146.940 MHz is on none, so
  # they use the measure rounded to 100 Hz (MC-3).
  - name: mc1a-sidebar-actions
    covers: [SidebarView.swift, PlanPickerView.swift, Sidebar.swift, Bands.swift, Sweep.swift,
      TransportBarView.swift]
    fixtures: [{name: scene_vhf20}]
    bookmarks: ../../site/shots/home.csv
    # A sweep's one step sees an over of 146.940 MHz, which a quarter-second step can miss.
