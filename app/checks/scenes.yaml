      - {cmd: wait, seconds: 1}
      - {cmd: ax, name: squelch-set}
      # Out of range: the row and its actions disabled, the reason in their help.
      - {cmd: press, identifier: sidebar.outofrange}
      - {cmd: press, identifier: sidebar.band.gmrs.chevron}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146520000, open_rows.0: 2m, open_rows.1: gmrs}}
      - {cmd: hover, identifier: sidebar.band.gmrs, expect: {tooltip: "GMRS is above what this radio tunes (142.7 – 163.7 MHz)"}}
      - {cmd: hover, identifier: sidebar.band.gmrs.channels, expect: {tooltip: "GMRS is above what this radio tunes (142.7 – 163.7 MHz)"}}
      - {cmd: snapshot, name: outofrange}
      - {cmd: ax, name: outofrange}
      - {cmd: press, identifier: sidebar.band.gmrs.chevron}
      # The picker closed by Escape, then by a pick: nothing focused, Space mutes, → tunes.
      - {cmd: press, identifier: sidebar.band.2m.channels}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {popover: "channels:2m"}}
      - {cmd: key, keys: escape}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {popover: "", focused: "", muted: false}}
      - {cmd: key, keys: space}
      - {cmd: state, expect: {focused: "", muted: true, filter_query: ""}}
      - {cmd: key, keys: space}
      - {cmd: state, expect: {muted: false}}
      - {cmd: press, identifier: sidebar.band.2m.channels}
      - {cmd: wait, seconds: 1}
      - {cmd: type, text: cal}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {popover: "", focused: "", tuned_hz: 146520000}}
      - {cmd: key, keys: right}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {focused: "", filter_query: "", tuned_hz: 146525000, bookmark: Near}}
      # The step arrows by accessibility: the band's step, never the fine one.
      - {cmd: press, identifier: tuning.up}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146530000}}
      - {cmd: press, identifier: tuning.down}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146525000, bookmark: Near}}
      # marine, tunable on this capture: twelve rows of 110, and 24 narrows them.
      - {cmd: press, identifier: sidebar.band.marine.chevron}
      - {cmd: press, identifier: sidebar.band.marine.channels}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {popover: "channels:marine", focused: "AXUnknown \"Filter marine VHF channels\""}}
      - {cmd: ax, name: marine, window: popover}
      - {cmd: type, text: "24"}
      - {cmd: ax, name: marine24, window: popover}
      - {cmd: key, keys: escape}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {popover: "", focused: ""}}
      # A hit tunes, and is bookmarked at, the frequency its row names.
      - {cmd: press, identifier: sidebar.bookmark.calling}
      - {cmd: wait, seconds: 1}
      - {cmd: press, identifier: sidebar.band.2m.scan}
      - {cmd: wait, seconds: 6, expect_log: ["sweep: job_.* ended: [0-9]+ hits?", "sweep: resuming bookmark Calling"]}
      # 146.940 is on no 2 m plan channel, so the measure is used to 100 Hz (MC-3): within
      # 500 Hz of the repeater, and never the measure's last two digits.
      - {cmd: click, identifier: sidebar.hit.146-940-mhz}
      - {cmd: wait, seconds: 1, expect_log: "tune: hit 146.940 MHz at 1469(39[5-9]|40[0-4])00 Hz"}
      - {cmd: press, identifier: sidebar.hit.146-940-mhz.add}
      - {cmd: wait, seconds: 1, expect_log: "bookmark: added 146.940 MHz at 1469(39[5-9]|40[0-4])00 Hz from a sweep hit"}

  # The inspector as the owner decided it (docs/plans/app.md, MC-1a): the tags line keeps its
  # place, so the frequency line and the Tone and Note fields sit at the same height on Tagged
  # and on Plain (compare the two trees' frames); and a click on the inspector's empty header
  # ends an edit in Tone or Note and saves it, as Return does (MC-3), while a refused tone
  # stays in the field with its sentence and is not saved.
  - name: mc1a-inspector
    covers: [InspectorView.swift, Tone.swift, Bookmarks.swift]
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    bookmarks: ../../site/shots/home.csv
    steps:
      - ley: [set, squelch, "off"]
      - ley: [bookmarks, add, "146.85", --name, Tagged, --tag, home, --tag, vhf]
      - ley: [bookmarks, add, "146.7", --name, Plain]
    stage:
      place: radio
      inspector: true
      select_bookmark: Tagged
      settle: 3
    app:
      - {cmd: state, expect: {tuned_hz: 146850000, bookmark: Tagged}}
      - {cmd: snapshot, name: tagged}
      - {cmd: ax, name: tagged}
      - {cmd: press, identifier: sidebar.bookmark.plain}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146700000, bookmark: Plain}}
      - {cmd: snapshot, name: plain}
      - {cmd: ax, name: plain}
      - {cmd: press, identifier: inspector.note}
      - {cmd: type, text: "a b"}
      - {cmd: state, expect: {focused: inspector.note}}
      - {cmd: click, x: 1300, y: 70}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {focused: ""}}
      - {cmd: file, path: bookmarks.json, contains: '"note"\s*:\s*"a b"'}
      - {cmd: ley, args: [bookmarks, --json], expect_stdout: '"name":"Plain"[^}]*"note":"a b"'}
      - {cmd: ax, name: note-ended}
      - {cmd: press, identifier: inspector.tone}
      - {cmd: type, text: D024N}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {focused: inspector.tone}}
      - {cmd: ax, name: refused}
      - {cmd: click, x: 1300, y: 70}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {focused: ""}}
      - {cmd: ax, name: tone-ended}
      - {cmd: ley, args: [bookmarks, --json], expect_stdout: '!"name":"Plain"[^}]*"tone"'}
