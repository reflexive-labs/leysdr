      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {transport.squelch_words: "", transport.squelch_caption: "open · off", transport.squelch_caption_short: true, transport.tuning: "146.5200"}}
      - {cmd: snapshot, name: narrow}
