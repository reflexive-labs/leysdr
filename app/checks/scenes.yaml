  # The pointer, the menus and a relaunch: a tooltip by hover; a click on the waterfall at
  # 146.940 MHz (the capture's 144.960 to 147.840 MHz across its 825 pt from x 237); View ▸
  # Show Assistant read and pressed; the panel's field typed into and its turns read through
  # state; and the app quit and started again on the same daemon, which it finds tuned where it
  # left it.
  - name: pointer-and-menus
    covers: [ChartMouse.swift, WaterfallView.swift, SidebarView.swift, AssistantPanel.swift,
      LeylineApp.swift, AssistantController.swift, AssistantModels.swift, ChannelFollow.swift]
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    bookmarks: ../../site/shots/home.csv
    ai: {script: assistant/hello.script}
    steps:
      - ley: [set, squelch, "off"]
    stage:
      place: radio
      inspector: true
      select_bookmark: Calling
      settle: 3
    app:
      - {cmd: state, expect: {muted: false, sink: other, volume: null, window.width: 1440, window.min_width: 900, view_window.low_hz: 144960000, view_window.high_hz: 147840000, settings_open: false, alert: null, assistant: null, tooltip: null}}
      - {cmd: hover, identifier: sidebar.add, expect: {tooltip: "Bookmark the tuned frequency (⌘D)"}}
      - {cmd: state, expect: {tooltip: "Bookmark the tuned frequency (⌘D)"}}
      - {cmd: click, x: 804, y: 400}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146939345, bookmark: null, tooltip: null}}
      - {cmd: menu, menu: "View>Show Assistant", read: true, expect: {title: Show Assistant, enabled: true, checked: false, items.8: Hide Inspector}}
      - {cmd: menu, menu: "View>Show Assistant"}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {assistant_shown: true, window.min_width: 1221, assistant.input: "", assistant.state: null}}
      - {cmd: press, identifier: assistant.input}
      - {cmd: type, text: where am i}
      - {cmd: state, expect: {focused: assistant.input, assistant.input: where am i, assistant.input_focused: true}}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 4}
      - {cmd: state, expect: {assistant.turns.0.role: user, assistant.turns.0.text: where am i, assistant.turns.1.role: assistant, assistant.turns.1.text: "The radio is on 146.520 MHz, the 2 m calling frequency, in NFM.", assistant.state: ready, assistant.thinking: false, assistant.stop_shown: false, assistant.input: "", assistant.buttons.0.id: assistant.new, assistant.buttons.0.enabled: true}}
      - {cmd: snapshot, name: answered}
      - {cmd: relaunch, stage: {place: radio, settle: 3}}
      - {cmd: state, expect: {tuned_hz: 146939345, assistant_shown: false}}

  # Settings, AI (docs/plans/app.md, "Settings, AI"): ⌘, and the app menu open the pane; with no
  # key it holds the explanation and the Add form alone, Add disabled while the key is empty and
  # the Endpoint field only for OpenAI-compatible; a key typed is hidden and cleared the moment
  # Add is pressed, and once the daemon holds it Features and Usage come in, with the toolbar's
  # toggle and View ▸ Show Assistant in the main window. The pickers write what they show;
  # Check, the usage table and its switch, Remove asking and the row leaving, the column going
  # with the key, a refused Add putting the key back and a closed window clearing it follow.
  - name: settings-ai
    covers: [SettingsView.swift, AISettingsView.swift, AssistantPanel.swift, LeylineApp.swift,
      AISettings.swift]
    fixtures: [{name: scene_2m}]
    bookmarks: ../../site/shots/home.csv
    ai: {script: assistant/hello.script, key: false}
    steps:
      - ley: [set, squelch, "off"]
    stage:
      place: radio
      inspector: true
      select_bookmark: Calling
      settle: 3
    app:
      - {cmd: ax, name: main-nokey}
      - {cmd: menu, menu: "View>Show Assistant", read: true, expect: {enabled: false}}
      - {cmd: key, keys: "cmd+,"}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {settings_open: true}}
      - {cmd: snapshot, name: nokey, window: settings}
      - {cmd: ax, name: nokey, window: settings}
      - {cmd: pick, identifier: settings.ai.add.provider, text: OpenAI-compatible}
      - {cmd: ax, name: endpoint, window: settings}
      - {cmd: pick, identifier: settings.ai.add.provider, text: Anthropic}
      - {cmd: press, identifier: settings.ai.add.key}
      - {cmd: state, expect: {focused: settings.ai.add.key}}
      - {cmd: type, text: sk-made-up-0042}
      # The focus leaves the key's field, which closes the system's password AutoFill list that
      # a secure field opens now and then, and which a tree would otherwise read.
      - {cmd: press, identifier: settings.ai.add.label}
      - {cmd: ax, name: typed, window: settings}
      - {cmd: press, identifier: settings.ai.add}
      - {cmd: ax, name: adding, window: settings}
      # The pane's words name the provider as its rows do; `ley ai` keeps the ids
      # (docs/plans/app.md, MC-1c).
      - {cmd: wait, seconds: 2, expect_log: ["settings: Anthropic key …0042 added", "!settings: anthropic key"]}
      - {cmd: snapshot, name: added, window: settings}
      - {cmd: ax, name: added, window: settings}
      - {cmd: ax, name: main-key}
      - {cmd: menu, menu: "View>Show Assistant", read: true, expect: {enabled: true}}
      - {cmd: ley, args: [ai, --json], expect_stdout: '"provider":"anthropic", "model":"claude-sonnet-5-5"'}
      # The model picker writes; OpenAI-compatible shows a model field and writes nothing until
      # a model is entered, the sentence under the pickers following the provider shown; back
      # to Anthropic, the one the daemon holds, drops the field and rewrites nothing.
      - {cmd: pick, identifier: settings.ai.feature.assistant.model, text: claude-opus-5-5}
      - {cmd: wait, seconds: 1, expect_log: "settings: Assistant now calls Anthropic claude-opus-5-5\\."}
      - {cmd: ley, args: [ai, --json], expect_stdout: '"provider":"anthropic", "model":"claude-opus-5-5"'}
      - {cmd: pick, identifier: settings.ai.feature.assistant.provider, text: OpenAI-compatible}
      - {cmd: ax, name: typedmodel, window: settings}
      - {cmd: ley, args: [ai, --json], expect_stdout: '"provider":"anthropic", "model":"claude-opus-5-5"'}
      - {cmd: pick, identifier: settings.ai.feature.assistant.provider, text: Anthropic}
      - {cmd: ax, name: heldagain, window: settings}
      - {cmd: ley, args: [ai, --json], expect_stdout: '"provider":"anthropic", "model":"claude-opus-5-5"'}
      - {cmd: pick, identifier: settings.ai.feature.assistant.provider, text: OpenAI-compatible}
      - {cmd: press, identifier: settings.ai.feature.assistant.model}
      - {cmd: type, text: gpt-made-up}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 1}
      - {cmd: ley, args: [ai, --json], expect_stdout: '"provider":"openai", "model":"gpt-made-up"'}
      - {cmd: ax, name: openai, window: settings}
      # The provider picker writes Anthropic's first model at once.
      - {cmd: pick, identifier: settings.ai.feature.assistant.provider, text: Anthropic}
      - {cmd: wait, seconds: 1}
      - {cmd: ley, args: [ai, --json], expect_stdout: '"provider":"anthropic", "model":"claude-opus-5-5"'}
      # Check updates the row's outcome and the line at the top.
      - {cmd: press, identifier: settings.ai.key.anthropic.check}
      - {cmd: wait, seconds: 1}
      - {cmd: ax, name: checked, window: settings}
      # A turn's usage in the table, by day and by month. No tree is kept: the rows are named
      # by today's date, and Settings has no regions to mask them by.
      - {cmd: ley, args: [ask, where am i]}
      - {cmd: wait, seconds: 1}
      - {cmd: snapshot, name: usage, window: settings}
      # The period switch is drawn in the palette, as the toolbar's Radio | Library switch is,
      # not as the system's blue segmented control (docs/plans/app.md, MC-1c).
      - {cmd: press, identifier: settings.ai.usage.period.month}
      - {cmd: snapshot, name: bymonth, window: settings}
      # Remove asks; the row, Features and Usage leave, and with them the open column, the
      # toolbar's toggle and the menu item.
      - {cmd: stage, stage: {assistant: true}}
      - {cmd: state, expect: {assistant_shown: true}}
      - {cmd: press, identifier: settings.ai.key.anthropic.remove}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {alert.title: "Remove the Anthropic key?"}}
      - {cmd: ax, name: removesheet, window: sheet}
      - {cmd: press, identifier: alert.remove}
      - {cmd: wait, seconds: 1, expect_log: "settings: Anthropic key removed"}
      - {cmd: ax, name: removed, window: settings}
      - {cmd: state, expect: {assistant_shown: false, assistant: null}}
      - {cmd: ax, name: main-removed}
      - {cmd: menu, menu: "View>Hide Assistant", read: true, expect: {enabled: false}}
      # A closed window clears a typed key, so Add is disabled once it is open again. (⌘W
      # closes no window in a check run: the app is never active, so File ▸ Close has no key
      # window; the stage closes it as its button would.)
      # The key's field opts out of AutoFill (docs/plans/app.md, MC-1c): focused and holding
      # text, its tree has no AutoFill list, and Settings closed with the focus still there stays
      # closed, where the list once brought it straight back.
      - {cmd: press, identifier: settings.ai.add.key}
      - {cmd: type, text: sk-made-up-0043}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {focused: settings.ai.add.key, settings_open: true}}
      - {cmd: ax, name: keyfocused, window: settings}
      - {cmd: stage, stage: {settings: false}}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {settings_open: false}}
      - {cmd: wait, seconds: 2}
      - {cmd: state, expect: {settings_open: false}}
      - {cmd: menu, menu: "Leyline>Settings..."}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {settings_open: true}}
      - {cmd: ax, name: reopened, window: settings}
      # A refused Add (the daemon not running) puts the key back, so Add is enabled again, and
      # says why in plain words.
      - {cmd: daemon, op: stop}
      - {cmd: wait, seconds: 1}
      - {cmd: press, identifier: settings.ai.add.key}
      - {cmd: type, text: sk-made-up-0044}
      - {cmd: press, identifier: settings.ai.add.label}
      - {cmd: press, identifier: settings.ai.add}
      - {cmd: wait, seconds: 2, expect_log: "settings: Could not add the Anthropic key: the daemon is not running\\."}
      - {cmd: ax, name: refused, window: settings}
      - {cmd: daemon, op: start}
      - {cmd: wait, seconds: 3}
      - {cmd: file, path: ai/record.jsonl, contains: where am i}

  # The assistant's conversation (docs/plans/app.md, the assistant panel): the toolbar's toggle
  # closes and opens the column, whose width the window's minimum gives back; Return sends and
  # clears the field, which keeps the focus; a slow answer shows the waiting row, one element for VoiceOver, counting from three seconds; a step opens to
  # its arguments, result and JSON and closes; two quick Returns send one message; Option-Return
  # makes a line and Space and ← type rather than mute and tune; while the assistant thinks the
  # field takes typing, Return keeps it and the line under it says why, and Stop ends the turn,
  # after which Return sends it; ⌘2 and ⌘1 keep the transcript and the field; a send the
  # stopped daemon refused puts the text back; and New Conversation empties the panel.
  # The scene sets no clock: the waiting row counts from the daemon's time of the turn
  # against the app's own clock, and a shifted daemon (leylined --wall-clock) puts it hours ahead.
  # ⇧⌘A is not sent: in a check run it never reaches View > Hide Assistant, which the menu
  # command reads instead.
  - name: assistant-conversation
    covers: [AssistantPanel.swift, LibraryView.swift, AssistantController.swift,
      AssistantModels.swift]
    fixtures: [{name: scene_2m}]
    bookmarks: ../../site/shots/home.csv
    ai: {script: assistant/conversation.script}
    steps:
      - ley: [set, squelch, "off"]
    stage:
      place: radio
      inspector: true
      select_bookmark: Calling
      assistant: true
      settle: 3
    app:
      - {cmd: state, expect: {assistant_shown: true, window.min_width: 1221, assistant.state: null, assistant.input: ""}}
      - {cmd: snapshot, name: empty}
      - {cmd: ax, name: empty}
      - {cmd: menu, menu: "View>Hide Assistant", read: true, expect: {enabled: true}}
      - {cmd: press, identifier: toolbar.assistant}
      - {cmd: state, expect: {assistant_shown: false, window.min_width: 900}}
      - {cmd: press, identifier: toolbar.assistant}
      - {cmd: state, expect: {assistant_shown: true}}
      - {cmd: press, identifier: assistant.input}
      - {cmd: type, text: where am i}
      - {cmd: key, keys: return}
      - {cmd: state, expect: {assistant.input: "", focused: assistant.input, assistant.turns.0.text: where am i}}
      - {cmd: wait, seconds: 1.5}
      - {cmd: state, expect: {assistant.thinking: true, assistant.stop_shown: true, focused: assistant.input}}
      - {cmd: ax, name: thinking}
      - {cmd: wait, seconds: 2.5}
      - {cmd: snapshot, name: counting}
      - {cmd: wait, seconds: 4}
      - {cmd: state, expect: {assistant.thinking: false, assistant.stop_shown: false, assistant.state: ready, assistant.turns.1.role: assistant, focused: assistant.input}}
      - {cmd: snapshot, name: answered}
      - {cmd: ax, name: answered}
      - {cmd: press, identifier: assistant.step.c1}
      - {cmd: wait, seconds: 0.5}
      - {cmd: snapshot, name: stepopen}
      - {cmd: ax, name: stepopen}
      - {cmd: press, identifier: assistant.step.c1}
      - {cmd: wait, seconds: 0.5}
      - {cmd: ax, name: stepclosed}
      # Space and ← go into the field rather than mute and tune; two Returns back to back
      # send one message.
      - {cmd: press, identifier: assistant.input}
      - {cmd: type, text: a}
      - {cmd: key, keys: space}
      - {cmd: type, text: b}
      - {cmd: key, keys: left}
      - {cmd: type, text: c}
      - {cmd: state, expect: {assistant.input: a cb, muted: false, tuned_hz: 146520000}}
      - {cmd: key, keys: return}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 2}
      - {cmd: state, expect: {assistant.turns.2.text: a cb, assistant.turns.3.text: "Still on 146.520 MHz."}}
      - {cmd: ax, name: once}
      # Option-Return makes a new line. While the assistant thinks, Return keeps what is typed
      # and the line under the field says why; Stop ends the turn and Return then sends it.
      - {cmd: type, text: line one}
      - {cmd: key, keys: opt+return}
      - {cmd: type, text: line two}
      - {cmd: state, expect: {assistant.input: "line one\nline two"}}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 1.5}
      - {cmd: state, expect: {assistant.input: "", assistant.turns.4.text: "line one\nline two", assistant.thinking: true, assistant.stop_shown: true}}
      - {cmd: type, text: next one}
      - {cmd: key, keys: return}
      - {cmd: state, expect: {assistant.input: next one, assistant.thinking: true}}
      - {cmd: ax, name: waits}
      - {cmd: press, identifier: assistant.stop}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {assistant.thinking: false, assistant.stop_shown: false, assistant.input: next one}}
      # The stopped turn says `Stopped.` under the message it answered (docs/plans/app.md, MC-1c).
      - {cmd: state, expect: {assistant.turns.4.text: "line one\nline two", assistant.turns.5.role: assistant, assistant.turns.5.stopped: true, assistant.turns.3.stopped: false}}
      - {cmd: ax, name: stopped}
      - {cmd: press, identifier: assistant.input}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 2}
      - {cmd: state, expect: {assistant.input: "", assistant.turns.5.stopped: true, assistant.turns.6.text: next one, assistant.turns.7.text: Here is the next one., assistant.turns.7.stopped: false}}
      - {cmd: snapshot, name: later}
      # ⌘2 and ⌘1 keep the transcript and the field's text.
      - {cmd: type, text: draft kept}
      - {cmd: key, keys: cmd+2}
      - {cmd: state, expect: {place: library, assistant.input: draft kept, assistant.turns.0.text: where am i}}
      - {cmd: key, keys: cmd+1}
      - {cmd: state, expect: {place: radio, assistant.input: draft kept, assistant.turns.7.text: Here is the next one.}}
      # A message the stopped daemon did not take goes back into the field.
      - {cmd: daemon, op: stop}
      - {cmd: wait, seconds: 1}
      - {cmd: press, identifier: assistant.input}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 2}
      - {cmd: state, expect: {assistant.input: draft kept}}
      - {cmd: ax, name: refused}
      - {cmd: daemon, op: start}
      - {cmd: wait, seconds: 3}
      - {cmd: press, identifier: assistant.new}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {assistant.state: null, assistant.input: draft kept}}
      - {cmd: ax, name: new}
      - {cmd: file, path: ai/record.jsonl, contains: where am i}

  # The assistant's questions (docs/plans/app.md, the assistant panel): a call the gate asks
  # about is a card under the transcript that Return does not answer and Decline does; a take
  # over offers Allow for this conversation between Decline and Allow, all three inside the
  # column at the window's narrowest, and once it is allowed for the conversation the next take
  # over runs without a card; a delete offers Decline and Allow alone, enabled at once. Once a
  # tune has run its step carries the run's channel ids, so state carries the checks from there.
  - name: assistant-cards
    covers: [AssistantPanel.swift, AssistantController.swift, AssistantModels.swift]
    sizes: [{width: 1440, height: 820}, {width: 1221, height: 820}]
    fixtures: [{name: scene_2m}]
    bookmarks: ../../site/shots/home.csv
    ai: {script: assistant/cards.script}
    steps:
      - ley: [set, squelch, "off"]
    stage:
      place: radio
      inspector: true
      select_bookmark: Calling
      assistant: true
      settle: 3
    app:
      - {cmd: press, identifier: assistant.input}
      - {cmd: type, text: remove the APRS bookmark}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 2}
      - {cmd: state, expect: {assistant.state: waiting for you, focused: assistant.input}}
      - {cmd: snapshot, name: asks}
      - {cmd: ax, name: asks}
      # Return does not answer the card; Decline does, and the card goes.
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {assistant.state: waiting for you}}
      - {cmd: press, identifier: assistant.decline}
      - {cmd: wait, seconds: 2}
      - {cmd: state, expect: {assistant.state: ready}}
      - {cmd: ax, name: declined}
      - {cmd: ley, args: [bookmarks], expect_stdout: APRS}
      # A take over: Decline, Allow for this conversation and Allow; once it is allowed for the
      # conversation, the second take over runs without a card.
      - {cmd: press, identifier: assistant.input}
      - {cmd: type, text: take the radio for 146.94}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 2}
      - {cmd: state, expect: {assistant.state: waiting for you}}
      - {cmd: snapshot, name: takeover}
      - {cmd: ax, name: takeover}
      - {cmd: press, identifier: assistant.allow.conversation}
      - {cmd: wait, seconds: 3}
      - {cmd: state, expect: {assistant.state: ready, assistant.buttons.2.title: "→ tune frequency 146.94 · keep true · take_over true, done", assistant.buttons.3.title: "→ tune frequency 147.18 · keep true · take_over true, done"}}
      # A delete offers Decline and Allow alone, enabled at once; while it waits the field takes
      # typing, Return keeps it, and the line under the field says why.
      - {cmd: press, identifier: assistant.input}
      - {cmd: type, text: delete job_none}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 2}
      - {cmd: state, expect: {assistant.state: waiting for you}}
      - {cmd: type, text: then stop}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {assistant.state: waiting for you, assistant.input: then stop, assistant.buttons.4.title: "→ delete_recording job_none, asks", assistant.buttons.5.id: assistant.decline, assistant.buttons.5.enabled: true, assistant.buttons.6.id: assistant.allow, assistant.buttons.6.enabled: true}}
      - {cmd: press, identifier: assistant.decline}
      - {cmd: wait, seconds: 2}
      - {cmd: state, expect: {assistant.state: ready, assistant.input: then stop}}
      # What was typed while the card waited is still the draft once the card has gone, and
      # Return sends all of it (docs/plans/app.md, MC-1c).
      - {cmd: press, identifier: assistant.input}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 2}
      - {cmd: state, expect: {assistant.input: "", assistant.turns.6.text: then stop, assistant.turns.7.text: Stopping there.}}
      - {cmd: file, path: ai/record.jsonl, contains: remove the APRS bookmark}
      - {cmd: file, path: ai/record.jsonl, contains: then stop}

  # The app's view tools (docs/plans/app.md, the assistant panel): the column opened in a narrow
  # window widens the window rather than squeezing the canvas, and the window's minimum grows by
  # it; "show me 2 m" fits the part of 2 m the radio captures, which on scene_2m is the whole
  # capture, and a range inside it zooms the waterfall and the rail onto it without moving the
  # radio; a tune puts the window back on the tuned frequency, "show me airband"
  # answers that a tune is needed and moves nothing, and show_place switches to the Library.
  # The pictures leave the inspector out: the fields of its identity come out a point taller
  # in some runs and move what is under them (docs/plans/app.md, "Found by the Mac checks").
  - name: assistant-view-tools
    covers: [AssistantPanel.swift, BandRailView.swift, WaterfallView.swift, SpectrumView.swift,
      LibraryView.swift, RecordingsPage.swift, PlayerBar.swift, AssistantViewTools.swift,
      AssistantController.swift, AssistantModels.swift]
    sizes: [{width: 1000, height: 820}]
    fixtures: [{name: scene_2m}]
