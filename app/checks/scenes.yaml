  # The tuning field (docs/plans/app.md, MC-1b): four decimals, cut and never rounded, while the
  # radio stays on the exact hertz, which the field's tooltip and the inspector's line give. A
  # typed 146.940186 tunes to the hertz and reads 146.9401, and Return with nothing typed keeps
  # that hertz (MC-3); the fine step keeps the hertz, the band's step lands on its 5 kHz grid,
  # and a hit's row tunes its measure to 100 Hz (MC-3). At 1440 pt the squelch's three words and
  # its long caption both show.
  - name: transport-tuning
    covers: [TransportBarView.swift, Frequency.swift, FrequencyEntry.swift, InspectorView.swift]
    fixtures: [{name: scene_vhf20}]
    bookmarks: ../../site/shots/home.csv
    # A sweep's one step sees an over of 146.940 MHz, which a quarter-second step can miss.
    sweep_dwell: 3
    steps:
      - ley: [stop, "146.52"]
    stage:
      place: radio
      inspector: true
      select_bookmark: Calling
      settle: 3
    app:
      - {cmd: ley, args: [set, squelch, "off"]}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146520000, transport.tuning: "146.5200", transport.squelch_caption: "open · squelch off", transport.squelch_caption_short: false, transport.squelch_words: "muted below · squelch off · heard above"}}
      - {cmd: menu, menu: "Tune>Enter Frequency..."}
      - {cmd: type, text: "146.940186"}
      - {cmd: state, expect: {transport.tuning: "146.940186"}}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 1, expect_log: "tune: typed 146.940186 -> 146940186 Hz"}
      - {cmd: state, expect: {tuned_hz: 146940186, transport.tuning: "146.9401"}}
      - {cmd: hover, identifier: tuning.field, expect: {tooltip: "146.940186 MHz"}}
      - {cmd: ax, name: typed}
      - {cmd: snapshot, name: typed}
      # Return with nothing typed keeps the exact hertz and tunes nothing (MC-3).
      - {cmd: menu, menu: "Tune>Enter Frequency..."}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 1, expect_log: ["tune: kept 146940186 Hz, 146.9401 unchanged", "!tune: typed"]}
      - {cmd: state, expect: {tuned_hz: 146940186, transport.tuning: "146.9401", focused: ""}}
      - {cmd: menu, menu: "Tune>Fine Tune Up"}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146940686, transport.tuning: "146.9406"}}
      - {cmd: menu, menu: "Tune>Tune Up"}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146945000, transport.tuning: "146.9450"}}
      - {cmd: press, identifier: tuning.down}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146940000, transport.tuning: "146.9400"}}
      - {cmd: press, identifier: sidebar.bookmark.calling}
      - {cmd: wait, seconds: 1}
      - {cmd: press, identifier: sidebar.band.2m.scan}
      - {cmd: wait, seconds: 6, expect_log: ["sweep: job_.* ended: [0-9]+ hits?", "sweep: resuming bookmark Calling"]}
      - {cmd: state, expect: {tuned_hz: 146520000}}
      - {cmd: click, identifier: sidebar.hit.146-940-mhz}
      # On no plan channel, so the measure to 100 Hz (MC-3).
      - {cmd: wait, seconds: 1, expect_log: "tune: hit 146.940 MHz at 1469(39[5-9]|40[0-4])00 Hz"}

  # The transport bar at the window's minimum (MC-1b): too narrow for the squelch's three words
  # and its long caption, so the words are dropped and the caption is the short one.
  - name: transport-narrow
    covers: [TransportBarView.swift, AudioLevelsView.swift, SquelchCaption.swift, AudioLevels.swift]
    sizes: [{width: 900, height: 612}]
