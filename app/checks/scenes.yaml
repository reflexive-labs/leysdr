# SPDX-License-Identifier: Apache-2.0
#
# The app's check scenes, which `make app-check` runs (docs/plans/mac-loop.md, ML-4). go/cmd/leyshots
# reads this file with `leyshots check`. Paths are relative to this directory.
#
# A check scene takes a site scene's inputs (site/shots/scenes.yaml, the header comment):
# fixtures, clock, bookmarks, steps and an optional stage, which is applied at launch. It runs once
# per entry of sizes, a window size in points (default 1440 x 820), each with its own
# leylined --no-hardware and its own launch of the app; the stage may not set window, the size
# does. Then it sends the app commands in order over the app's command file (mac-loop.md, ML-3,
# "The protocol") and quits it. Each entry of app is one protocol command, without the id, which
# the runner assigns:
#
#   {cmd: stage, stage: {...}}            a stage applied to the running window (no window)
#   {cmd: snapshot, name: N}              the window's picture, compared with the golden N.png;
#                                         settle waits first; mask lists regions left out of the
#                                         diff (default [spectrum, waterfall, readings,
#                                         transmissions, log_day, heard], which change between
#                                         runs; [] compares everything)
#   {cmd: state, expect: {path: value}}   the view state; each dotted path into the answer's
#                                         result must hold the value, or the line fails
#   {cmd: ax, name: N}                    the accessibility tree, compared as text with N.ax.txt;
#                                         mask as snapshot's: an element inside a masked region
#                                         reads value=<masked> (<masked>) on both sides; window:
#                                         settings reads the Settings window (open it with the
#                                         key cmd+,) instead of the main one, unmasked
#   {cmd: key, keys: cmd+g}               a key, as the protocol names keys
#   {cmd: type, text: wx3}                one key event per character
#   {cmd: press, identifier: I}           presses the element with that accessibility identifier
#   {cmd: wait, seconds: S}
#
# A state or a wait may take expect_log, patterns the app's log (run/app.log) must hold among the
# lines written from the moment the command before was sent; a line that matches is printed with
# its timestamp. A pattern is a Go regular expression, and one that starts with ! must not match;
# expect_log, expect_stdout and contains each take one pattern or a list.
#
# These entries of app the runner runs itself, in order with the others; they never reach the app:
#
#   {cmd: ley, args: [bookmarks, --json]} a ley command against the scene's daemon and bookmarks;
#                                         expect_exit (default 0) and expect_stdout are checked,
#                                         and the output goes to run/steps.log
#   {cmd: ley_bg, id: T, args: [tune, 146.52]}
#                                         a ley started in the background, its output in
#                                         run/ley_bg-T.log; one still running when the scene ends
#                                         is interrupted
#   {cmd: kill, id: T}                    interrupts ley_bg T as Ctrl-C would and waits for it; it
#                                         fails when T had exited already or does not exit
#   {cmd: file, path: bookmarks.json, contains: ["Club", "!Simplex"]}
#                                         a file of the run directory (bookmarks.json, app.log,
#                                         leylined.log, steps.log, ai/record.jsonl) matched
#   {cmd: daemon, op: stop}               stops the scene's leylined; op: start starts it again on
#                                         the same socket, store and keys and plays the fixtures
#                                         again, so the app reconnects
#
# ai: {script: assistant/hello.script, model: M, provider: P, key: true} runs the daemon's
# assistant on a scripted model (go/internal/assistant, Scripted: one JSON response a line), with
# a ley shim that accepts any key as the daemon's worker check. Before the app starts a made-up
# key is added for P (default anthropic) and M chosen (default the provider's); key: false adds
# none. Nothing reaches a provider, and the key lives in the scene daemon's own data directory.
#
# sweep_dwell: S makes a scan on the scene's file radio dwell S seconds (leylined
# --file-scan-dwell): a file radio sweeps in one step, which otherwise ends in a quarter of a
# second, too soon to see the sweep or stop it.
#
# threshold is the percentage of compared pixels a snapshot may change and still pass (default
# 0.1). Goldens live in tmp/goldens/<macOS major.minor>-<arch>/<scene>/<W>x<H>/ and are written only
# by `make app-check RECORD=1`.
#
# Fixtures made for checks (go/cmd/leyfix/scenes.go): scene_gmrs (GMRS 462 MHz, channels 1, 5 and
# 21), scene_vhf20 (2 m, MURS, marine and NOAA WX2 in one capture, 142.7 to 163.7 MHz),
# scene_wx (the NOAA channels with nothing on the air) and scene_wx_on (WX2 and WX1 on the air);
# ../../fixtures/chirp/nofreq.csv is a CSV the CHIRP import refuses. `make app-check` runs a
# release leylined whatever SWIFT_CONFIG says: a debug one plays scene_vhf20 at about half of real
# time, so its timings would be wrong.

scenes:
  # The site's app-radio-2m inputs, without its on_air wait: the 2 m band open on Calling.
  - name: radio-2m
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    bookmarks: ../../site/shots/home.csv
    steps:
      - ley: [set, squelch, "-45"]
    stage:
      place: radio
      inspector: true
      expanded_band: 2m
      select_bookmark: Calling
      settle: 5
      zoom: 4
    app:
      - {cmd: snapshot, name: initial}
      - {cmd: state, expect: {tuned_hz: 146520000}}
      - {cmd: ax, name: initial}

  # Go to… (⌘G) by name: Club repeater, a bookmark at 146.940 MHz, inside scene_2m's capture
  # (146.400 MHz centre at 2.88 MS/s, so 144.96 to 147.84 MHz). A file radio tunes only inside
  # the capture it was recorded with, so the name must lie there.
  - name: goto-bookmark
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    bookmarks: ../../site/shots/home.csv
    steps:
      - ley: [set, squelch, "-45"]
    stage:
      place: radio
      settle: 3
    app:
      - {cmd: key, keys: cmd+g}
      - {cmd: type, text: club}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 2}
      - {cmd: state, expect: {tuned_hz: 146940000, bookmark: Club repeater}}
      - {cmd: snapshot, name: after}
      # The filter (docs/plans/app.md, U4): ⌘G from the Library brings the Radio and the
      # field's focus; wx3 lists the NOAA row, dimmed because this radio cannot tune it; Escape
      # clears the field and lets it go; zz matches nothing; and a name with a space in it
      # types the space rather than muting, and Return tunes it, clears the field and lets it go.
      - {cmd: press, identifier: toolbar.place.library}
      - {cmd: key, keys: cmd+g}
      - {cmd: state, expect: {place: radio, focused: sidebar.filter}}
      - {cmd: type, text: wx3}
      - {cmd: state, expect: {filter_query: wx3, focused: sidebar.filter}}
      - {cmd: ax, name: wx3}
      - {cmd: key, keys: escape}
      - {cmd: state, expect: {filter_query: "", focused: ""}}
      - {cmd: key, keys: cmd+g}
      - {cmd: type, text: zz}
      - {cmd: ax, name: zz}
      - {cmd: snapshot, name: zz}
      - {cmd: key, keys: escape}
      - {cmd: key, keys: cmd+g}
      - {cmd: type, text: evening net}
      - {cmd: state, expect: {filter_query: evening net, focused: sidebar.filter}}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 2}
      - {cmd: state, expect: {tuned_hz: 147180000, bookmark: Evening net, filter_query: "", focused: ""}}

  # The window's accessibility identifiers (docs/dev/app.md, "Staged runs"), reached by press:
  # the toolbar's switch both ways, the rail's zoom, a bookmark's row (a tap gesture, which is an
  # accessibility button too), then a band row's Channels…, whose popover the second tree holds,
  # and the device chip; last, Settings, opened by its key, whose AI pane the third tree holds.
  - name: identifiers
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    bookmarks: ../../site/shots/home.csv
    steps:
      - ley: [set, squelch, "-45"]
    stage:
      place: radio
      inspector: true
      select_bookmark: Calling
      settle: 3
    app:
      - {cmd: ax, name: radio}
      - {cmd: press, identifier: toolbar.place.library}
      - {cmd: state, expect: {place: library}}
      - {cmd: press, identifier: toolbar.place.radio}
      - {cmd: state, expect: {place: radio}}
      - {cmd: press, identifier: rail.zoom.in}
      - {cmd: state, expect: {zoom: 2}}
      - {cmd: press, identifier: sidebar.bookmark.club-repeater}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146940000, bookmark: Club repeater}}
      - {cmd: press, identifier: sidebar.band.2m.channels}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {popover: "channels:2m"}}
      - {cmd: ax, name: planpicker}
      - {cmd: press, identifier: toolbar.device}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {popover: device_menu}}
      - {cmd: key, keys: "cmd+,"}
      - {cmd: wait, seconds: 1}
      - {cmd: ax, name: settings, window: settings}

  # The sidebar's rows (docs/plans/app.md, U4 and U6): the tuned 2 m row open with its range
  # line, action strip and bookmarks; the bands outside the file radio's capture folded into one
  # line, which a press opens and the next tune folds again; a folded band dimmed, its press doing
  # nothing, its chevron opening it without a tune; a bookmark at 462.6625 MHz reading ch5 under
  # GMRS, one at 500 MHz under Other; and the inspector's tags line, present on a tagged bookmark
  # and absent on one without. The squelch is off, because the words over the squelch track
  # follow the noise while it is muted, and no region masks them; the track itself moves with
  # the signal, about 1.2 % of the picture, hence the threshold.
  - name: sidebar-rows
    threshold: 1.5
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    bookmarks: ../../site/shots/home.csv
    steps:
      - ley: [set, squelch, "off"]
      - ley: [bookmarks, add, "462.6625", --name, Family]
      - ley: [bookmarks, add, "500", --name, Far]
      - ley: [bookmarks, add, "146.85", --name, Tagged, --tag, home, --tag, vhf]
      - ley: [bookmarks, add, "146.7", --name, Plain]
    stage:
      place: radio
      inspector: true
      select_bookmark: Calling
      settle: 3
    app:
      - {cmd: snapshot, name: initial}
      - {cmd: ax, name: initial}
      - {cmd: state, expect: {tuned_hz: 146520000, open_rows.0: 2m}}
      - {cmd: press, identifier: sidebar.outofrange}
      - {cmd: press, identifier: sidebar.band.gmrs}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146520000}}
      - {cmd: press, identifier: sidebar.band.gmrs.chevron}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146520000, open_rows.0: 2m, open_rows.1: gmrs}}
      - {cmd: snapshot, name: unfolded}
      - {cmd: ax, name: unfolded}
      # 6 m has no plan, so its strip holds Scan band alone; one row opens by its chevron at a
      # time, so GMRS closes.
      - {cmd: press, identifier: sidebar.band.6m.chevron}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146520000, open_rows.0: 6m, open_rows.1: 2m}}
      - {cmd: ax, name: noplan}
      - {cmd: press, identifier: sidebar.bookmark.tagged}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146850000, bookmark: Tagged, open_rows.0: 2m}}
      - {cmd: ax, name: tagged}
      - {cmd: press, identifier: sidebar.bookmark.plain}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146700000, bookmark: Plain}}
      - {cmd: ax, name: plain}

  # The plan picker, Channels… (docs/plans/app.md, U4): it opens beside its action with its
  # field focused; typing narrows the rows; Escape closes it; Return picks the highlighted row
  # and closes it. Then marine's 110 rows, opened from the out-of-range fold: twelve rows tall,
  # and 24 narrows them to 24 and 24 coast. The popover is a window of its own, which the
  # window's picture leaves out, and the focused field is named by its label, because state
  # finds no identifier on it. Up and Down are not sent: keys reach the main window, so the
  # picker's key monitor never sees them in a check run.
  - name: plan-picker
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    bookmarks: ../../site/shots/home.csv
    steps:
      - ley: [set, squelch, "off"]
    stage:
      place: radio
      inspector: true
      select_bookmark: Club repeater
      settle: 3
    app:
      - {cmd: press, identifier: sidebar.band.2m.channels}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {popover: "channels:2m", focused: "AXUnknown \"Filter 2 m amateur channels\""}}
      - {cmd: ax, name: open}
      - {cmd: type, text: cal}
      - {cmd: ax, name: narrowed}
      - {cmd: key, keys: escape}
      - {cmd: state, expect: {popover: "", tuned_hz: 146940000}}
      - {cmd: press, identifier: sidebar.band.2m.channels}
      - {cmd: wait, seconds: 1}
      - {cmd: type, text: cal}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {popover: "", tuned_hz: 146520000, bookmark: Calling}}
      - {cmd: press, identifier: sidebar.outofrange}
      - {cmd: press, identifier: sidebar.band.marine.chevron}
      - {cmd: press, identifier: sidebar.band.marine.channels}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {popover: "channels:marine", focused: "AXUnknown \"Filter marine VHF channels\""}}
      - {cmd: type, text: "24"}
      - {cmd: ax, name: marine24}

  # The bookmark's Tone and Note in the inspector (docs/plans/app.md, U6): on Calling they show
  # its saved values; a step up with →, to a frequency with no bookmark, takes both away, and
  # naming that frequency with the pencil brings them back with their placeholders. (The arrows
  # by the frequency are not pressed: they step finely while the person at the Mac holds ⇧.)
  # A tone typed and Returned keeps the field's focus; a bad one stays in the field
  # with the reason under it, which a good tone, Escape (putting the saved value back) and a
  # tune to another bookmark each take away.
  - name: bookmark-fields
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    bookmarks: ../../site/shots/home.csv
    steps:
      - ley: [set, squelch, "off"]
    stage:
      place: radio
      inspector: true
      select_bookmark: Calling
      settle: 3
    app:
      - {cmd: ax, name: calling}
      - {cmd: key, keys: right}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146525000, bookmark: null}}
      - {cmd: ax, name: unnamed}
      - {cmd: press, identifier: inspector.rename}
      - {cmd: type, text: Spot}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {bookmark: Spot}}
      - {cmd: snapshot, name: named}
      - {cmd: ax, name: named}
      - {cmd: press, identifier: inspector.tone}
      - {cmd: state, expect: {focused: inspector.tone}}
      - {cmd: type, text: "100.0"}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {focused: inspector.tone}}
      - {cmd: ax, name: toned}
      - {cmd: key, keys: cmd+a}
      - {cmd: type, text: D024N}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 1}
      - {cmd: snapshot, name: refused}
      - {cmd: ax, name: refused}
      - {cmd: key, keys: cmd+a}
      - {cmd: type, text: D023N}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 1}
      - {cmd: ax, name: good}
      - {cmd: key, keys: cmd+a}
      - {cmd: type, text: D024N}
      - {cmd: key, keys: return}
      - {cmd: key, keys: escape}
      - {cmd: wait, seconds: 1}
      - {cmd: ax, name: escaped}
      - {cmd: press, identifier: inspector.tone}
      - {cmd: key, keys: cmd+a}
      - {cmd: type, text: D024N}
      - {cmd: key, keys: return}
      - {cmd: press, identifier: sidebar.bookmark.club-repeater}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146940000}}
      - {cmd: ax, name: tuned}

  # The tone last heard beside the bookmark's (docs/plans/app.md, U6): Calling's overs carry PL
  # 100.0, and once one has been measured it stays between overs; Evening net's read DCS 023; a
  # tune away and straight back clears it until the next over is measured; and a bookmark whose
  # tone differs from the heard one shows both. state's heard says what the inspector writes;
  # the picture shows the words beside the field, and the tree reads it with the squelch's words
  # and level, which follow the noise between overs, masked as the squelch region.
  - name: heard-tones
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    bookmarks: ../../site/shots/home.csv
    steps:
      - ley: [set, squelch, "-45"]
    stage:
      place: radio
      inspector: true
      select_bookmark: Calling
      settle: 3
    app:
      - {cmd: wait, seconds: 10}
      - {cmd: state, expect: {bookmark: Calling, heard: PL 100.0}}
      - {cmd: wait, seconds: 5}
      - {cmd: state, expect: {heard: PL 100.0}}
      - {cmd: press, identifier: sidebar.bookmark.evening-net}
      - {cmd: wait, seconds: 12}
      - {cmd: state, expect: {bookmark: Evening net, heard: DCS 023}}
      - {cmd: press, identifier: sidebar.bookmark.calling}
      - {cmd: press, identifier: sidebar.bookmark.evening-net}
      - {cmd: state, expect: {bookmark: Evening net, heard: null}}
      - {cmd: press, identifier: sidebar.bookmark.calling}
      - {cmd: press, identifier: inspector.tone}
      - {cmd: key, keys: cmd+a}
      - {cmd: type, text: "88.5"}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 10}
      - {cmd: state, expect: {bookmark: Calling, heard: PL 100.0}}
      - {cmd: snapshot, name: differs, mask: [spectrum, waterfall, readings, transmissions, log_day, squelch]}
      - {cmd: ax, name: differs, mask: [spectrum, waterfall, readings, transmissions, log_day, squelch]}

  # CHIRP import (docs/plans/app.md, U7), through File ▸ Import CHIRP…'s code path: the notice
  # gives the counts and no row or editor opens; the bookmarks land under their bands, the
  # 70 cm ones and GMRS's unnamed ch5 in the out-of-range fold; Club shows its tone and note;
  # and a note typed on Simplex survives the file imported again, which updates all nine.
  - name: chirp-import
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    steps:
      - ley: [set, squelch, "off"]
    stage:
      place: radio
      inspector: true
      import_chirp: ../../fixtures/chirp/sample.csv
      settle: 3
    app:
      - {cmd: state, expect: {notices.0: "Imported 9 from sample.csv: 8 added, 1 updated, 1 skipped", open_rows.0: 2m}}
      - {cmd: ax, name: imported}
      - {cmd: press, identifier: sidebar.outofrange}
      - {cmd: press, identifier: sidebar.band.70cm.chevron}
      - {cmd: wait, seconds: 1}
      - {cmd: ax, name: seventy}
      - {cmd: press, identifier: sidebar.band.gmrs.chevron}
      - {cmd: wait, seconds: 1}
      - {cmd: ax, name: gmrs}
      - {cmd: press, identifier: sidebar.bookmark.club}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146940000, bookmark: Club}}
      - {cmd: ax, name: club}
      - {cmd: press, identifier: sidebar.bookmark.simplex}
      - {cmd: wait, seconds: 1}
      - {cmd: press, identifier: inspector.note}
      - {cmd: type, text: kept}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 1}
      - {cmd: stage, stage: {import_chirp: ../../fixtures/chirp/sample.csv}}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {bookmark: Simplex, notices.0: "Imported 9 from sample.csv: 0 added, 9 updated, 1 skipped"}}
      - {cmd: ax, name: reimported}

  # Scan band on the tuned 2 m row (docs/plans/app.md, U5), as the site's scan-app shot runs it:
  # once the sweep's hits show, the audio is back on Calling with the band's mode and width; the
  # hits are listed strongest first, each named by its channel or else its frequency, with a
  # tick on the rail; and a hit's ＋ makes a bookmark named after it, its row open as an editor.
  # scene_scan sweeps in one step, so nothing here holds the sweep's own words or its Stop. The
  # tree is not kept: the levels move by a decibel between runs, and the two 41 dB hits trade
  # places, so state asserts the order where it is clear. The picture leaves the sidebar out.
  - name: scan-hits
    threshold: 1.5
    fixtures: [{name: scene_scan}]
    clock: "19:42"
    bookmarks: ../../site/shots/home.csv
    steps:
      - ley: [stop, all]
      - ley: [tune, "146", --persistent]
    stage:
      place: radio
      inspector: true
      expanded_band: 2m
      select_bookmark: Calling
      scan_band: true
      settle: 3
    app:
      - {cmd: state, expect: {tuned_hz: 146520000, mode: NFM, bandwidth_hz: 12500, bookmark: Calling, hits.0: calling, hits.1: 146.940 MHz, hits.4: 145.230 MHz}}
      - {cmd: snapshot, name: hits, mask: [spectrum, waterfall, readings, transmissions, log_day, heard, sidebar]}
      - {cmd: press, identifier: sidebar.hit.146-940-mhz.add}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {tuned_hz: 146520000, focused: "AXUnknown \"Name\""}}

  # The assistant with no AI provider set up (docs/plans/app.md, the assistant panel, K1): the
  # toolbar has no toggle and ⇧⌘A opens no column. (leyshots's stage has no assistant key yet.)
  - name: assistant-absent
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    bookmarks: ../../site/shots/home.csv
    steps:
      - ley: [set, squelch, "off"]
    stage:
      place: radio
      inspector: true
      select_bookmark: Calling
      settle: 3
    app:
      - {cmd: key, keys: shift+cmd+a}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {assistant_shown: false}}
      - {cmd: snapshot, name: absent}
      - {cmd: ax, name: absent}
