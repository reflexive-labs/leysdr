      - {cmd: press, identifier: sidebar.band.murs}
      - {cmd: wait, seconds: 2}
      - {cmd: state, expect: {bandwidth_hz: 11250}}
      - {cmd: snapshot, name: murs}
      - {cmd: ax, name: murs, mask: [spectrum, waterfall, readings, transmissions, log_day, squelch, sidebar, inspector]}
      - {cmd: ley, args: [set, mode, wfm, --channel, "151.88"]}
      - {cmd: ley, args: [set, bw, 200k, --channel, "151.88"]}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {mode: WFM, bandwidth_hz: 200000}}
      - {cmd: snapshot, name: wfm}
      - {cmd: ley, args: [set, bw, "0.5", --channel, "151.88"]}
      - {cmd: ley, args: [set, mode, cw, --channel, "151.88"]}
      - {cmd: wait, seconds: 1}
      - {cmd: state, expect: {mode: CW, bandwidth_hz: 500}}
      - {cmd: snapshot, name: cw}
      - {cmd: press, identifier: toolbar.inspector}
      - {cmd: ley, args: [set, mode, nfm, --channel, "151.88"]}
      - {cmd: ley, args: [set, bw, "11.25", --channel, "151.88"]}
