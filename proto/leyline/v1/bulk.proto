// leyline.v1 — bulk plane
// Sample-bearing streams. Offer/answer negotiation; the answer is authoritative.
// Payloads are opaque bytes in the negotiated format — samples are never protobuf-encoded per element.
// No lossless network stream exists: lossless work is a daemon-side FileSink.
syntax = "proto3";
package leyline.v1;

option go_package = "github.com/dpup/leysdr/go/gen/leyline/v1;leylinev1";
import "leyline/v1/common.proto";
import "leyline/v1/control.proto";

// ---------- Negotiation ----------

message SubscribeRequest {
  oneof source {
    string capture_id = 1;  // IQ / FFT of the whole capture
    string channel_id = 2;  // audio / decoded / channel-filtered IQ
  }
  StreamKind kind = 3;
  DeliveryPolicy policy = 4;     // default LATEST_WINS
  StreamPosition start = 5;      // v0: LIVE only
  // Default GRPC. SHM_RING is the one documented bypass for local bulk streams; the daemon
  // answers every subscription with GRPC until the ring exists, so read the transport off the
  // StreamDescriptor rather than assuming the one requested.
  Transport transport = 6;
  // Desired parameters; daemon may downgrade, never upgrade.
  oneof params {
    IqParams iq = 7;
    FftParams fft = 8;
    AudioParams audio = 9;
    PersistenceParams persistence = 10;
  }
}

enum StreamKind { STREAM_KIND_UNSPECIFIED = 0; IQ = 1; FFT = 2; AUDIO = 3; DECODED = 4; PERSISTENCE = 5; }
enum Transport { TRANSPORT_UNSPECIFIED = 0; GRPC = 1; SHM_RING = 2; }

// v0 IQ contract: the daemon serves raw IQ as CF32 at the capture's native sample rate only.
// A request must leave `format` UNSPECIFIED or CF32 and `sample_rate` 0 or the capture rate;
// anything else is refused with INVALID_ARGUMENT (the message names the accepted values) rather
// than silently overridden. The descriptor always answers CF32 at the capture rate. Integer
// formats (CS8/CS16) and decimated IQ are additive v1 negotiation, not a v0 promise.
message IqParams { uint64 sample_rate = 1; SampleFormat format = 2; }
message FftParams {
  uint32 bins = 1;               // daemon serves from a fixed power-of-two ladder
  FftBinFormat bin_format = 2;
  double rows_per_second = 3;
  // How a row is built from the samples it covers. ROW_SNAPSHOT (the default, and
  // what a request that leaves this unset gets) computes one periodogram per
  // row from whichever block crossed the row boundary: at 2.4 MSPS a
  // 1024-point FFT covers 0.17% of a 250 ms row, so a burst shorter than the
  // row appears only sometimes. That is fine for a live band chart, whose
  // reader is looking at "now", and wrong for anything reading duty cycle.
  FftAccumulation accumulation = 4;
  // Looks the daemon actually took per row. Answer only: a request must leave
  // it 0. Always 1 under SNAPSHOT.
  uint32 looks_per_row = 5;
  // Which stage of a channel's chain the spectrum is taken from, meaningful only
  // when the subscription's source is a channel; the daemon echoes the tap it serves.
  //
  // An FFT subscription with a `channel_id` source is the spectrum of that channel's
  // audio, not of the radio: rows of dB per bin from 0 Hz to half the audio rate,
  // one transform of a Hann-windowed sliding window per row. The descriptor answers
  // `center_hz = rate/4` and `span_hz = rate/2`, so the row layout every FFT reader
  // already understands holds; `bins` comes from the same ladder and `rows_per_second`
  // is at most 20, which is as fast as a meter is read. `accumulation` does not apply
  // -- a row is the one transform -- and the descriptor answers ROW_SNAPSHOT. A RAW_IQ
  // channel has no audio and refuses with INVALID_ARGUMENT, as does an unknown tap.
  AudioTap tap = 6;
}
enum FftAccumulation {
  FFT_ACCUMULATION_UNSPECIFIED = 0;
  // Value names are siblings of their type within the package (C++ scoping),
  // so these carry a ROW_ prefix: a bare SNAPSHOT collides with ResourceKind.
  ROW_SNAPSHOT = 1;  // one periodogram per row
  ROW_MEAN = 2;      // power mean over the row: a stable floor, dilutes short bursts
  ROW_MAX = 3;       // max over the row: catches bursts; the noise floor reads
                     // a few dB high, because the maximum of N draws is biased up
}
enum FftBinFormat { FFT_BIN_FORMAT_UNSPECIFIED = 0; DB_U8 = 1; DB_F32 = 2; }
message AudioParams {
  uint32 sample_rate = 1;
  AudioSampleFormat format = 2;
  // Which stage of the channel's chain this stream carries; the daemon echoes the
  // tap it serves in the descriptor.
  AudioTap tap = 3;
}
enum AudioSampleFormat { AUDIO_SAMPLE_FORMAT_UNSPECIFIED = 0; S16 = 1; F32 = 2; }

// Where in the channel the audio is taken from.
//
// TAP_AUDIO is what a speaker gets -- after the high-pass, de-emphasis, limiter and
// AGC -- and is the default, so a subscription that does not mention a tap is served
// exactly what it always was.
//
// TAP_DEMOD is the detector's own output before any audio conditioning: the
// discriminator for NFM (the samples the sub-audible detector reads, so a CTCSS tone
// is still on them) and for WFM (decimated to the audio rate, before de-emphasis and
// the 15 kHz low-pass, so the 19 kHz pilot is visible), the envelope including the
// carrier as DC for AM, and the product detector before AGC for USB, LSB and CW. It
// keeps flowing while the squelch is closed, because what a transmitter is sending
// between words is what it is for, where TAP_AUDIO is zeros there as the speaker
// hears. A RAW_IQ channel has no detector, so TAP_DEMOD on one is refused with
// INVALID_ARGUMENT rather than served silence.
enum AudioTap { TAP_AUDIO = 0; TAP_DEMOD = 1; }

// A persistence (phosphor) frame: for each frequency bin, how often each level
// has been seen lately. Bright means usual, faint means rare-but-real. It
// answers a different question from FFT -- "what is usually here" rather than
// "what is here now" -- and it is the one band view that works without fine
// time resolution, because it accumulates over time instead of resolving it.
//
// Payload is `bins * levels` little-endian uint16 counts, bin-major: all of
// bin 0's level buckets, then bin 1's. Level bucket i covers
// [floor_db + i*range_db/levels, floor_db + (i+1)*range_db/levels).
//
// The client supplies floor_db and range_db and the daemon does not guess: a
// daemon-chosen scale would have to appear in the descriptor before any row
// had arrived. A request that leaves them 0 is refused rather than defaulted,
// because a persistence frame on the wrong scale is not obviously wrong to
// look at.
//
// Counts halve every half_life_seconds, which bounds them and makes "usual"
// mean "usual lately". They saturate at uint16 max rather than wrapping.
message PersistenceParams {
  uint32 bins = 1;               // served from the FFT ladder's power-of-two sizes
  uint32 levels = 2;             // level buckets per bin
  double floor_db = 3;           // dBFS at the bottom of the level axis
  double range_db = 4;           // dB the level axis spans
  double half_life_seconds = 5;  // how fast a count decays; 0 = daemon default
  double rows_per_second = 6;    // frames delivered, not rows accumulated
}

// The authoritative answer. Clients interpret frames from this alone.
message StreamDescriptor {
  string stream_id = 1;
  StreamKind kind = 2;
  DeliveryPolicy policy = 3;
  oneof params {
    IqParams iq = 4;
    FftParams fft = 5;
    AudioParams audio = 6;
    PersistenceParams persistence = 11;
  }
  uint64 center_hz = 7;          // FFT/IQ/persistence context
  uint64 span_hz = 8;
  oneof transport {
    bool grpc = 9;               // pull via Stream(stream_id)
    ShmRing shm = 10;
  }
}

// Local fast path. Ring layout (native byte order):
//   header: magic "LEYR", u32 version, u64 write_seq (monotonic), u32 slot_size, u32 slot_count,
//           serialized StreamDescriptor
//   slot:   u64 seq, u64 sample_index, u32 payload_len, payload
// Readers chase write_seq; falling behind is detected by seq check -> resync (latest-wins by construction).
message ShmRing {
  string path = 1;       // POSIX shm name
  uint32 slot_size = 2;
  uint32 slot_count = 3;
}

// ---------- Frames (gRPC transport) ----------

message Frame {
  string stream_id = 1;
  uint64 seq = 2;
  SampleTime time = 3;
  Gap gap = 4;           // present only under GAP_MARKED after a drop
  bytes payload = 5;     // format per StreamDescriptor
}

service Bulk {
  rpc Subscribe(SubscribeRequest) returns (StreamDescriptor);
  rpc Stream(StreamRef) returns (stream Frame);   // GRPC transport only
  rpc Unsubscribe(StreamRef) returns (Empty);
}
message StreamRef { string stream_id = 1; }
