// leyline.v1 — jobs and resources
// A job is a daemon-owned persistent intent. Persistence follows intent: job outputs are
// durable resources; interactive actions are ephemeral unless explicitly kept.
// This is a table of watches, not a workflow engine — no retry DAG, no replay.
syntax = "proto3";
package leyline.v1;

option go_package = "github.com/dpup/leysdr/go/gen/leyline/v1;leylinev1";
import "leyline/v1/common.proto";
import "leyline/v1/telemetry.proto";
import "leyline/v1/decode.proto";

// ---------- Jobs ----------

message Job {
  string job_id = 1;
  JobState state = 2;
  int64 created_at_ns = 3;
  ClientInfo created_by = 4;
  oneof config {
    WatchConfig watch = 5;
    ScanConfig scan = 6;
    RecordConfig record = 7;
    DecodeConfig decode = 11;
    MonitorConfig monitor = 12;
  }
  // ley:// resources produced so far. A record job's is ley://recordings/<job_id> and a kept
  // decode job's ley://records/<job_id>; both are on disk and outlive the daemon, and the
  // Resources service resolves them. A scan job's ley://scans/<scan_id> is resolved by
  // Jobs.GetScan for as long as the daemon remembers the job (its last sixteen finished ones,
  // forgotten on restart); a persisted scan arrives with the durable job store.
  repeated string result_uris = 8;
  string status_detail = 9;         // human-readable, e.g. "out of capture since 14:02, 3 gaps logged"
  // Why a FAILED job failed: `code` is the stable string a client branches on and `message` the
  // daemon's human-readable description. Set only on FAILED; `status_detail` is prose and never
  // carries the code, so a client that wants to tell "the radio cannot tune that" from "somebody
  // is using it" reads this rather than splitting an English sentence.
  ErrorDetail error = 10;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  RUNNING = 1;
  DEGRADED = 2;   // e.g. watch channel OUT_OF_CAPTURE — logging gaps, will rebind
  COMPLETED = 3;
  CANCELLED = 4;
  FAILED = 5;
}

// "Watch 146.52 and log anything heard." Owns a persistent channel; produces a transcript.
message WatchConfig {
  uint64 frequency_hz = 1;
  DemodMode mode = 2;
  bool record_clips = 3;
  int64 end_at_ns = 4;      // 0 = until cancelled
}

// Sweep -> persisted Scan resource. Respects don't-disturb: idle device or decline with reason.
message ScanConfig {
  FrequencyRange range = 1;
  // The advance between hops, chosen by the daemon from the radio's sample rate and its own
  // geometry: a value sent here is ignored. `Job.config` echoes the request as it was made, and
  // the copy carried by the resulting Scan states the advance the sweep really used.
  uint32 step_hz = 2;
  uint32 dwell_ms = 3;
  oneof schedule { bool once = 4; string recurring = 5; } // recurring: cron expression
  // Sweep a radio somebody else is using. Off by default: a sweep owns the radio for seconds at a
  // time, so the allocator declines a capture with channels, a live audio sink or a recent
  // interactive write, and names what is using it. This is the explicit override.
  bool take_over = 6;
  // Which radio to sweep. Empty means the daemon picks: an idle device first, then one whose
  // capture nobody is using. Without this a two-radio setup has no way to say which.
  string device_id = 7;
  // The tuner gain to sweep at. A sweep always pins the gain for its whole duration, because SNR
  // measured against a moving AGC is meaningless; this sets the level. `db` pins the element there
  // (the first gain element when `element` is empty); `auto` asks the driver where its AGC settles
  // and pins that. Unset, the sweep pins the gain the radio is on -- whatever the last client left it at,
  // which is why two sweeps of one band could differ by 6 dB of floor. `Scan.gains` reports the
  // level the sweep ran at either way, and the entry gain is restored when the radio is handed back.
  GainWrite gain = 8;
  // Gains to pin, one stage at a time, applied in order, each read as `gain` is (an empty element
  // is the device's first, a name matches ignoring case). When `gains` is non-empty `gain` is
  // ignored; `gain` stays for a client that sends one stage. A refusal fails the sweep with the
  // device's code and message, and `Scan.gains` still reports every stage the sweep ran at.
  repeated GainWrite gains = 9;
}

// A recording is a job's output (docs/design/recording.md). Control.AttachSink(file) stays
// refused: a sink attached to somebody's channel dies with that channel's owner and leaves a file
// nothing indexes, while a job goes through the allocator (invariant 9), outlives the client that
// started it, and produces a resource (invariant 8). The job's id is the recording's id, so
// `Job.result_uris` holds ley://recordings/<job_id>.
message RecordConfig {
  uint64 frequency_hz = 1;
  DemodMode mode = 2;         // RAW_IQ records the capture's IQ; anything else records audio
  int64 start_at_ns = 3;      // 0 = now; a later start is refused UNIMPLEMENTED in v1
  int64 duration_ms = 4;      // 0 = until cancelled or stop_after_quiet_ms

  // Record what an existing channel hears, with its mode, bandwidth and squelch. frequency_hz
  // and mode are ignored. The job borrows the channel and does not own it: when the channel's
  // owner destroys it the job ends COMPLETED, "channel ended". With RAW_IQ the channel's capture
  // is recorded.
  string channel_id = 5;
  string device_id = 6;       // empty = the daemon picks, as a scan or decode does
  bool take_over = 7;         // retune a capture somebody is using; off by default
  uint32 bandwidth_hz = 8;    // 0 = the mode's default, as CreateChannel
  double squelch_dbfs = 9;    // NaN or unset = the channel default (auto), as ley tune
  GainWrite gain = 10;        // absent = leave the radio's gain alone

  RecordGate gate = 11;       // NONE (default) or SQUELCH
  uint32 pre_roll_ms = 12;    // audio kept from before the squelch opened; default 500
  uint32 hang_ms = 13;        // how long after the squelch closes a part stays open; default 5000
  int64 stop_after_quiet_ms = 14; // end the job after this long with the squelch closed; 0 = never
  int64 part_ms = 15;         // cut parts on this timer; 0 = audio: one part, IQ: 60000
  // Gains to set on the capture the job makes, applied in order, each read as `gain` is (an empty
  // element is the device's first). A refusal fails the job with the device's code and message.
  // When `gains` is non-empty `gain` is ignored; `gain` stays for a client that sends one stage.
  // A borrowed channel's capture is left as its owner set it, whichever is sent.
  repeated GainWrite gains = 16;
}

// What opens and closes a recording's parts. A gated recording writes no file while the squelch is
// closed, and its manifest says where the gaps were: time is never edited (invariant 5).
enum RecordGate {
  RECORD_GATE_UNSPECIFIED = 0;
  NONE = 1;
  SQUELCH = 2;
}

// Watch one band -- narrow enough to fit a single capture -- and report the carriers that come and
// go, in time order. Unlike a scan it does not sweep: it parks one capture on the band and runs the
// detector continuously, so it never time-shares and cannot miss a transmission by being tuned
// elsewhere. Detections stream on the telemetry plane (DETECTION), the same as a scan's;
// the client folds them into a transmission log. A band wider than one capture can analyse is
// refused with INVALID_ARGUMENT (use scan, which sweeps). This is the band-watching design's
// occupancy/burst view (docs/design/band-watching.md), the stationary sibling of ley scan.
message MonitorConfig {
  FrequencyRange range = 1;   // the band to watch; must fit one capture
  int64 duration_ms = 2;      // how long to watch; 0 = until cancelled
  // Which radio. Empty means the daemon picks, as a scan does.
  string device_id = 3;
  // Watch even when somebody is using the radio; off by default, same don't-disturb rule as a scan.
  bool take_over = 4;
}

// ---------- Derived products ----------

// Contiguous squelch-open interval on a watched channel. The building block of transcripts.
message ActivitySegment {
  SampleTime start = 1;
  SampleTime end = 2;
  double peak_dbfs = 3;
  double mean_dbfs = 4;
  string clip_uri = 5;      // empty if clips weren't recorded
}

message Transcript {
  string job_id = 1;
  repeated ActivitySegment segments = 2;
  repeated Gap coverage_gaps = 3;   // out-of-capture or daemon downtime, listed rather than hidden
}

message Scan {
  string scan_id = 1;
  ScanConfig config = 2;
  repeated Detection detections = 3;
  repeated NoiseFloorSegment noise_floor = 4;
  int64 started_at_ns = 5;
  int64 completed_at_ns = 6;
  // The gain the sweep pinned for its whole duration. A sweep must not run under the tuner's AGC
  // -- the gain moves after every hop and SNR against a moving reference is meaningless -- and a
  // scan that does not say which gain it ran at cannot be compared with another.
  repeated GainState gains = 7;
  // The analysis bin width, in Hz. Every dB in this message -- floor_dbfs, snr_db -- is per bin,
  // and those numbers depend on the bin width: a wider bin holds more noise. A
  // client should print this alongside the floor rather than deriving it from step_hz, which
  // describes where the radio pointed and not how finely it looked.
  uint32 resolution_hz = 8;
  // What the sweep actually covered. Never wider than config.range, and narrower whenever the
  // radio could not reach all of it, the request fell partly in the tuner's own blind spot, or the
  // sweep was stopped early. A client must not report config.range as the searched range: part of
  // it may never have been measured.
  FrequencyRange covered = 9;
}
message NoiseFloorSegment { FrequencyRange range = 1; double floor_dbfs = 2; }

// ---------- Resources ----------
// URIs: ley://recordings/<id>, ley://scans/<id>, ley://snapshots/<id>, ley://watches/<id>/transcript
// The store is a plain directory Finder can see; content retrieval locally is a file path.

message Resource {
  string uri = 1;
  ResourceKind kind = 2;
  int64 created_at_ns = 3;
  uint64 size_bytes = 4;
  string originating_job_id = 5;    // empty for explicit keeps
  // Queryable, and frozen per kind because ListResourcesRequest.metadata_filter matches on these
  // by exact string. A RECORDING carries: kind (audio|iq), frequency_hz, mode, bandwidth_hz
  // (0 for IQ; added 2026-09-24), sample_rate, format, duration_ms, parts, started_at_ns,
  // ended_at_ns, ended_by, device (docs/design/recording.md, "The wire"). Adding a key is
  // additive; renaming one is not.
  map<string, string> metadata = 6;
}

enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  RECORDING = 1;
  SCAN = 2;
  SNAPSHOT = 3;
  TRANSCRIPT = 4;
  RECORDS = 5;      // ley://records/<job_id>, a kept decode job's records (decode.proto)
}

service Jobs {
  rpc StartJob(StartJobRequest) returns (Job);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc GetJob(JobRef) returns (Job);
  rpc CancelJob(JobRef) returns (Job);
  rpc GetTranscript(TranscriptRequest) returns (Transcript);
  rpc GetScan(ScanRef) returns (Scan);
}

// The stores on disk, read back. Samples are never streamed: a local client is handed a path and
// opens the file (docs/design/data-planes.md, "no lossless network stream").
service Resources {
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
  rpc GetResource(ResourceRef) returns (Resource);
  // ley://recordings/<id> resolves to the recording's directory and ley://recordings/<id>/<part>
  // to that part's samples file. RESOURCE_NOT_FOUND does not exist: a recording's id is its job's,
  // so a missing one is JOB_NOT_FOUND.
  rpc ResolveLocalPath(ResourceRef) returns (LocalPath); // UDS clients read the file directly
  // Removes a recording's directory, every part and its manifest. Refused FAILED_PRECONDITION
  // while its job is running: cancel the job first, and the recording it made stays until it is
  // deleted. A playback of one of its parts is stopped first, as StopPlayback stops it, so its
  // tombstone goes out on the event plane before the files go. A part's uri is INVALID_ARGUMENT:
  // a recording is deleted whole. A missing recording is JOB_NOT_FOUND, as above. Additive on
  // 2026-09-24 for the window's delete button (docs/design/recording.md, "The wire");
  // `ley recordings delete` is its mirror.
  rpc DeleteResource(ResourceRef) returns (DeletedResource);
}

message StartJobRequest {
  oneof config { WatchConfig watch = 1; ScanConfig scan = 2; RecordConfig record = 3; DecodeConfig decode = 4; MonitorConfig monitor = 5; }
}
message ListJobsRequest { repeated JobState states = 1; } // empty = all
message ListJobsResponse { repeated Job jobs = 1; }
message JobRef { string job_id = 1; }
message TranscriptRequest { string job_id = 1; StreamPosition from = 2; } // from: bounded reads of long watches
message ScanRef { string scan_id = 1; }
message ListResourcesRequest { ResourceKind kind = 1; map<string, string> metadata_filter = 2; }
message ListResourcesResponse { repeated Resource resources = 1; }
message ResourceRef { string uri = 1; }
message LocalPath { string path = 1; }
message DeletedResource { string uri = 1; uint64 freed_bytes = 2; } // what the delete removed
