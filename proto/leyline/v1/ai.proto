// leyline.v1 — keys and usage
// Model calls on the user's own provider key (docs/design/ai.md). The daemon holds the keys and
// never returns one: a client can set, check and delete a key and read what is known about it,
// and the workers the daemon spawns are the only processes that see the secret. Usage is kept in
// the provider's own units (requests, tokens, audio seconds); cost and spend limits stay with the
// provider.
syntax = "proto3";
package leyline.v1;

option go_package = "github.com/reflexive-labs/leysdr/go/gen/leyline/v1;leylinev1";
import "leyline/v1/common.proto";

// ---------- Keys ----------
// One key per provider. A provider is the name of a kind of endpoint ("anthropic", "openai",
// "deepgram"); `endpoint` points one at a gateway or an OpenAI-compatible server instead of the
// provider's own API.

// What the daemon knows about a stored key. It never carries the secret.
message Credential {
  string provider = 1;
  string label = 2;
  string last_four = 3;          // the secret's last four characters, so a person can tell keys apart
  string endpoint = 4;           // empty = the provider's own API
  int64 added_at_ns = 5;         // CLOCK_REALTIME
  int64 last_used_at_ns = 6;     // a worker took the key for a call; 0 = never
  CredentialCheck last_check = 7;
}

// The result of the last time a worker tried the key against the provider.
message CredentialCheck {
  // UNAVAILABLE means the check could not run (no worker, the provider unreachable), which says
  // nothing about the key itself.
  enum Outcome { OUTCOME_UNSPECIFIED = 0; ACCEPTED = 1; REJECTED = 2; UNAVAILABLE = 3; }
  Outcome outcome = 1;
  string message = 2;            // the provider's words, or why the check could not run
  int64 at_ns = 3;               // CLOCK_REALTIME
}

// The only message that carries a secret, and only towards the daemon.
message SetCredentialRequest {
  string provider = 1;
  string secret = 2;
  string label = 3;
  string endpoint = 4;           // empty = the provider's own API
}
message CredentialRef { string provider = 1; }

// The provider and model a feature calls. feature: "assistant" | "speech".
message FeatureModel {
  string feature = 1;
  string provider = 2;
  string model = 3;
}

// Every key and every feature's model. Event.ai and GetStateResponse.ai carry the whole of it, so
// a deleted key is a shorter list and needs no tombstone.
message AIState {
  repeated Credential credentials = 1;
  repeated FeatureModel features = 2;
}
message GetAIStateRequest {}

service Credentials {
  // Stores the key, replacing any for the provider, then checks it once; the reply carries the
  // outcome in `last_check`.
  rpc SetCredential(SetCredentialRequest) returns (Credential);
  // Removes the key and ends every job that uses the provider with CREDENTIAL_MISSING.
  rpc DeleteCredential(CredentialRef) returns (Empty);
  rpc CheckCredential(CredentialRef) returns (Credential);
  rpc GetAIState(GetAIStateRequest) returns (AIState);
  rpc SetFeatureModel(FeatureModel) returns (FeatureModel);
}

// ---------- Usage ----------

// What one provider response used, in the provider's units. A worker sends one per response with
// Usage.ReportUsage; a decoder plugin, which has no socket, puts one on its DecodeRecord instead.
message UsageReport {
  string provider = 1;
  string model = 2;
  string feature = 3;            // "assistant" | "speech" | "check"
  // The scope the call was made for: one of these two is set.
  string job_id = 4;
  string conversation_id = 5;
  uint64 requests = 6;
  uint64 input_tokens = 7;
  uint64 output_tokens = 8;
  uint64 cache_read_tokens = 9;
  uint64 cache_write_tokens = 10;
  double audio_seconds = 11;
  int64 at_ns = 12;              // CLOCK_REALTIME
}

// The ledger's grain: the sum of reports for one provider, model, feature, scope and UTC day.
// Days are UTC because that is how the providers' consoles count, so the two can be compared.
message UsageLine {
  string provider = 1;
  string model = 2;
  string feature = 3;
  string scope_id = 4;           // the job or conversation id
  string day = 5;                // "2026-10-14", UTC
  uint64 requests = 6;
  uint64 input_tokens = 7;
  uint64 output_tokens = 8;
  uint64 cache_read_tokens = 9;
  uint64 cache_write_tokens = 10;
  double audio_seconds = 11;
  int64 last_at_ns = 12;         // CLOCK_REALTIME of the latest report folded in
}

// Every field filters; an empty one matches everything.
message GetUsageRequest {
  int64 since_ns = 1;            // CLOCK_REALTIME; 0 = the whole ledger
  string provider = 2;
  string feature = 3;
  string scope_id = 4;
}
message GetUsageResponse { repeated UsageLine lines = 1; }

service Usage {
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse);
  // Adds a report to the ledger. Workers call it over the socket like any client, so any socket
  // client can add to the ledger.
  rpc ReportUsage(UsageReport) returns (Empty);
}
