// leyline.v1 — telemetry plane
// Low-rate structured observations: what the radio sees, as opposed to state someone changed.
// Full protobuf messages (unlike bulk payloads); all carry the sample timebase.
// Delivery is latest-wins with sequence numbers.
syntax = "proto3";
package leyline.v1;

option go_package = "github.com/dpup/leysdr/go/gen/leyline/v1;leylinev1";
import "leyline/v1/common.proto";

message TelemetrySubscription {
  oneof scope { bool daemon = 1; string capture_id = 2; string channel_id = 3; }
  repeated TelemetryType types = 4; // empty = all
}

enum TelemetryType {
  TELEMETRY_TYPE_UNSPECIFIED = 0;
  METER = 1;
  SQUELCH_TRANSITION = 2;
  DETECTION = 3;
  CAPTURE_ACTIVITY = 4;
  SUB_AUDIBLE = 5;
}

message TelemetryMsg {
  uint64 seq = 1;
  SampleTime time = 2;
  oneof body {
    Meter meter = 3;
    SquelchTransition squelch = 4;
    Detection detection = 5;
    CaptureActivityMsg activity = 6;
    SubAudible sub_audible = 7;
  }
}

// A sub-audible tone under an FM transmission: CTCSS/PL today, DCS later.
//
// Edge-triggered on a change of identity or confidence band, plus a 1 Hz
// heartbeat while a tone is held (the telemetry plane has no GetState, so a
// client that subscribes mid-transmission has to be told what is already
// there). Full state every message.
//
// The honesty rules this message exists to encode:
//   - tone_hz is measured; standard_tone_hz is classified, and is 0 when two
//     standard tones could both explain the measurement. The EIA ladder is
//     spaced as tightly as 2.3 Hz (67.0/69.3), and snapping to the nearer one
//     names the wrong tone with a straight face.
//   - confidence is a STATED SCORE, not a probability:
//       clamp((tone_snr_db-6)/14) * clamp(1-|tone_hz-standard_tone_hz|/tol)
//                                 * min(hops_agreeing,3)/3
//     Calibrating a real probability needs a corpus of off-air recordings we do
//     not have. The measured fields are always populated, so a client can
//     threshold on those and ignore the score.
//   - Known false positive: 50 Hz mains hum lands on exactly 100.0 Hz, is
//     perfectly stable, and passes every frequency test; 100.0 Hz is also one
//     of the commonest real PL tones. Only deviation_hz separates them.
message SubAudible {
  string channel_id = 1;
  SubAudibleKind kind = 2;
  double tone_hz = 3;           // measured; NaN when nothing was measured
  double standard_tone_hz = 4;  // classified; 0 = measured but not classifiable
  // Reserved for the DCS decoder, which does not exist yet: the CTCSS detector leaves both at
  // their zero values, so a client cannot read `dcs_code == 0` as "not a DCS squelch".
  uint32 dcs_code = 5;          // octal as decimal (023 -> 23)
  bool dcs_inverted = 6;
  double deviation_hz = 7;      // peak deviation the tone was sent at
  double tone_snr_db = 8;       // the tone against the rest of the 60-260 Hz band
  double confidence = 9;        // stated score, not a probability; formula above
  SampleTime first_seen = 10;
  // How many recent analysis hops agreed on the tone. The detector counts them for the
  // confidence formula above but does not report the count, so this stays 0; a client reads
  // confidence rather than deriving its own from this.
  uint32 hops_agreeing = 11;
}
enum SubAudibleKind {
  SUB_AUDIBLE_KIND_UNSPECIFIED = 0;
  SUB_AUDIBLE_NONE = 1;   // looked, found nothing
  SUB_AUDIBLE_CTCSS = 2;
  SUB_AUDIBLE_DCS = 3;
}

// Fixed cadence while the channel is active (default 10 Hz, daemon-configured).
message Meter {
  string channel_id = 1;
  double power_dbfs = 2;   // channel IQ power: what the squelch measures
  // power_dbfs over the band's noise floor at the channel's width: the median bin of the
  // capture's spectrum plus 10*log10(bandwidth / bin width), the number the auto squelch
  // is measured from. NaN until the capture has read a row.
  double snr_db = 3;
  bool squelch_open = 4;
  // What the listener actually hears, measured on the demodulated block rather
  // than on the channel IQ. A strong carrier with no modulation has a high
  // power_dbfs and a low audio_dbfs; the two answer different questions.
  // Both are NaN before the first block, and NaN (never 0) whenever the value
  // was not measured -- 0 dBFS is a real, very loud level.
  double audio_dbfs = 5;       // RMS over the meter interval
  double audio_peak_dbfs = 6;  // largest sample in the interval; -inf when digitally silent
  // FM only, from the calibrated discriminator; NaN for every other mode.
  // Reserved here so the numbers are settled; populated when the sub-audible
  // tap lands, because a deviation read off the de-emphasised audio would be
  // wrong by whatever de-emphasis did to it.
  reserved 7;  // deviation_hz
  reserved 8;  // freq_error_hz
}

// Edge-triggered, exact in sample time — transcript features key on this, not on Meter.
//
// Fields 3-5 summarise the transmission that just ended and are set on the CLOSE edge only
// (open == false). On an open edge duration_samples is 0 and both peaks are NaN: a transmission
// that has not finished has no duration and no final peak. They cost the hot path two compares
// and let a client keep a log of what happened on a frequency without subscribing to meters.
message SquelchTransition {
  string channel_id = 1;
  bool open = 2;
  uint64 duration_samples = 3;   // CAPTURE samples the squelch was open (SampleTime's rate,
                                 // not the channel's), so a client converts it with the capture
                                 // sample rate it already knows
  double peak_snr_db = 4;        // loudest SNR seen while open; NaN on an open edge
  double peak_audio_dbfs = 5;    // loudest block power seen while open; NaN on an open edge
  reserved 6;                    // SubAudible tone, when CTCSS lands
}

// The atom of the semantic tier. v0 detector: energy detection over the FFT ladder.
message Detection {
  string detection_id = 1;
  string capture_id = 2;
  uint64 center_hz = 3;
  uint32 bandwidth_hz = 4;
  double snr_db = 5;
  SampleTime first_seen = 6;
  SampleTime last_seen = 7;
  // Sparse in v0: cheap heuristics only (bandwidth class, carrier presence) or absent.
  // A real classifier slots in here later without schema change.
  string modulation_guess = 8;
  double guess_confidence = 9; // 0 when guess is absent
  // The evidence, so a client can tell a carrier from a burst instead of the daemon deciding.
  // looks = spectrum rows in which this cleared the threshold; looks_possible = rows that covered
  // this frequency at all. A repeater reads 8/8, a packet burst 1/8. Persistence is reported, not
  // used as a gate: the threshold already spends a whole sweep's false-alarm budget, and demanding
  // presence in half a dwell would make exactly the intermittent traffic an operator cares about
  // invisible.
  uint32 looks = 10;
  uint32 looks_possible = 11;
  // The local noise floor snr_db was measured against, dBFS per bin. Local because the tuner's IF
  // response tilts the floor several dB across a span -- one number per row cannot describe it.
  double floor_dbfs = 12;
}

message CaptureActivityMsg {
  string capture_id = 1;
  CaptureActivitySnapshot snapshot = 2;
}
message CaptureActivitySnapshot {
  int64 last_interactive_write_ns = 1;
  uint32 live_audio_sinks = 2;
}

service Telemetry {
  rpc Subscribe(TelemetrySubscription) returns (stream TelemetryMsg);
}
