// leyline.v1 — control plane
// State and intent. Low-rate except WriteParams, which is coalesced fire-and-forget.
syntax = "proto3";
package leyline.v1;

option go_package = "github.com/dpup/leysdr/go/gen/leyline/v1;leylinev1";
import "leyline/v1/common.proto";
import "leyline/v1/jobs.proto";

// ---------- Capability model ----------

message DeviceDescriptor {
  string device_id = 1;          // dev_<ulid>, stable across replug by serial
  string driver = 2;             // "rtlsdr" | "hackrf" | "airspy" | "sdrplay" | "file" | "composite" | ...
  string model = 3;
  string serial = 4;
  string usb_location = 5;       // empty for virtual devices
  DeviceState state = 6;
  repeated FrequencyRange tuning_ranges = 7;
  repeated uint64 sample_rates = 8;
  SampleFormat native_format = 9;
  repeated GainElement gain_elements = 10; // ordered as in the signal path
  bool provides_timestamps = 11;
  // Escape hatch: vendor features without schema changes. Cross-device concepts get first-class fields.
  // Well-known keys include "bias_tee", "direct_sampling", "tx_capable", "full_duplex"
  // (half-duplex TX devices like HackRF suspend capture to emit), "tuner", "serial_collision"
  // (two dongles share a serial) and "held_externally" (another program has the device; state is
  // IN_USE until it is released).
  map<string, FeatureValue> features = 12;
}

enum DeviceState { DEVICE_STATE_UNSPECIFIED = 0; AVAILABLE = 1; IN_USE = 2; DISCONNECTED = 3; }
enum SampleFormat { SAMPLE_FORMAT_UNSPECIFIED = 0; CS8 = 1; CS16 = 2; CF32 = 3; }

message GainElement {
  string name = 1;    // e.g. "LNA", "VGA", "TUNER"
  double min_db = 2;
  double max_db = 3;
  double step_db = 4;
  bool supports_auto = 5;
  // Discrete valid settings when the element is not continuous (e.g. RTL-SDR tuner gain table).
  // When non-empty, step_db is 0 and the daemon snaps writes to the nearest entry.
  repeated double valid_db = 6;
}

message FeatureValue {
  oneof value { bool flag = 1; int64 integer = 2; double number = 3; string text = 4; }
}

// ---------- Session model: capture -> channel -> sink ----------

message Capture {
  string capture_id = 1;
  string device_id = 2;          // exactly one device per capture (composite devices absorb multi-SDR)
  uint64 center_hz = 3;
  uint64 sample_rate = 4;
  // The tombstone convention, which Channel and Sink follow too: a destroyed
  // object is emitted one last time with its state field unset, and that is the
  // only signal it is gone -- drop it from your mirror. CAPTURE_DETACHED means
  // something else: the radio is unplugged and the capture rebinds if it comes
  // back, so a destroy and a yanked dongle must not look alike on the wire.
  CaptureState state = 5;
  CaptureAnchor anchor = 6;
  CaptureActivity activity = 7;  // the don't-disturb signal
  ClientInfo created_by = 8;
  repeated GainState gains = 9;  // current setting of every GainElement, in descriptor order
}


enum CaptureState { CAPTURE_STATE_UNSPECIFIED = 0; CAPTURE_ACTIVE = 1; CAPTURE_DETACHED = 2; }

message CaptureActivity {
  int64 last_interactive_write_ns = 1; // 0 if never
  uint32 live_audio_sinks = 2;
}

message Channel {
  string channel_id = 1;
  string capture_id = 2;
  int64 offset_hz = 3;           // from capture center; absolute freq = center + offset
  uint32 bandwidth_hz = 4;
  DemodMode mode = 5;
  double squelch_db = 6;         // dBFS threshold; NaN = squelch off
  GainMode agc = 7;
  ChannelState state = 8;  // unset on an event is the tombstone; see Capture.state
  bool persistent = 9;           // survives owner disconnect; jobs set this
  // Set by jobs: the absolute frequency a channel wants back when its capture moves out from
  // under it. Stored and echoed; the rebind it describes belongs to watch jobs and nothing acts
  // on it yet.
  uint64 required_hz = 10;
  ClientInfo owner = 11;
  // Watch for a sub-audible tone (CTCSS/PL) under this channel. NFM only;
  // ignored for every other mode. Detection is reported on the telemetry plane
  // and never gates audio -- tone squelch is a separate, later decision, and
  // field 13 is held for it, because every false negative there is silence the
  // user cannot diagnose.
  bool subaudible_detect = 12;
  reserved 13;  // subaudible_squelch_hz
}

enum GainMode { GAIN_MODE_UNSPECIFIED = 0; MANUAL = 1; AUTO = 2; }
enum ChannelState { CHANNEL_STATE_UNSPECIFIED = 0; CHANNEL_ACTIVE = 1; OUT_OF_CAPTURE = 2; }

message Sink {
  string sink_id = 1;
  string channel_id = 2;
  oneof kind {
    SystemAudioSink system_audio = 3;  // daemon plays via CoreAudio
    // Client pulls over the bulk plane. `AttachSink` refuses this kind -- a client that wants
    // channel audio or IQ negotiates it with `Bulk.Subscribe`, which is where delivery policy and
    // transport are agreed.
    StreamSink stream = 4;
    FileSink file = 5;                 // daemon records; lossless lives here, never on the network
  }
  // A detached sink is emitted one last time with state unset -- the tombstone
  // Capture.state describes. Without it an attach and a detach are the same
  // bytes on the wire, and a client watching its own audio cannot tell that
  // somebody else just stopped it.
  SinkState state = 6;
}
enum SinkState { SINK_STATE_UNSPECIFIED = 0; SINK_ACTIVE = 1; }

message SystemAudioSink {
  string audio_device_uid = 1;
  optional double volume = 2;  // 0..1; absent = 1.0 (full), explicit 0 = muted
}
message StreamSink { string stream_id = 1; }
message FileSink {
  FileSinkKind kind = 1;
  string resource_uri = 2; // ley://recordings/<id>, assigned by daemon
}
enum FileSinkKind { FILE_SINK_KIND_UNSPECIFIED = 0; RECORD_IQ = 1; RECORD_AUDIO = 2; }

// ---------- Coalesced parameter writes ----------
// Client-streams writes; daemon coalesces last-value-per-parameter per tick, applies, emits state
// events. No per-write ack. Rejections come back as WriteRejected events carrying the client tag.

message ParamWrite {
  uint64 tag = 1;       // client-assigned, echoed in WriteRejected
  string target_id = 2; // capture_id or channel_id
  oneof param {
    uint64 center_hz = 3;        // capture
    uint64 capture_sample_rate = 4;
    int64 offset_hz = 5;         // channel
    uint32 bandwidth_hz = 6;
    DemodMode mode = 7;
    double squelch_db = 8;
    GainWrite gain = 9;          // device gain element, addressed via the capture
    double sink_volume = 10;     // target_id = sink_id
  }
}
message GainWrite { string element = 1; oneof value { double db = 2; bool auto = 3; } }
message WriteSummary { uint64 writes_received = 1; uint64 writes_applied = 2; }

// ---------- Events ----------
// Full new state of the changed object, never deltas. Per-stream sequence numbers;
// reconnect = fetch state, resume live.

message Event {
  uint64 seq = 1;
  ClientInfo caused_by = 2;
  oneof body {
    DeviceDescriptor device = 3;      // arrival/removal/state change
    Capture capture = 4;
    Channel channel = 5;
    Sink sink = 6;
    WriteRejected write_rejected = 7;
    CaptureAnchor anchor = 8;
    // A job's state changed. Jobs are daemon state like everything else here, so a client renders
    // them by subscription rather than by polling GetJob; Job is already a whole-object message,
    // so this stays full-state (never a delta) like every other member.
    Job job = 9;
  }
}
message WriteRejected { uint64 tag = 1; ErrorDetail error = 2; }

message EventScope {
  oneof scope { bool daemon = 1; string capture_id = 2; }
  // WatchEvents only: when set, replay retained events with seq > since_seq
  // (the seq of a GetState snapshot, 0 included) before going live, so
  // "GetState then WatchEvents" misses nothing. Unset = live only. The daemon
  // retains a bounded window; when since_seq is older than it, the first
  // delivered seq is more than since_seq + 1 and the client re-fetches
  // GetState (the seq-gap rule).
  optional uint64 since_seq = 3;
}

// ---------- Service ----------

service Control {
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc WatchEvents(EventScope) returns (stream Event);
  rpc GetState(GetStateRequest) returns (GetStateResponse); // snapshot for reconnect

  rpc CreateCapture(CreateCaptureRequest) returns (Capture);
  rpc DestroyCapture(DestroyCaptureRequest) returns (Empty);
  rpc CreateChannel(CreateChannelRequest) returns (Channel);
  rpc DestroyChannel(DestroyChannelRequest) returns (Empty);
  rpc AttachSink(AttachSinkRequest) returns (Sink);
  rpc DetachSink(DetachSinkRequest) returns (Empty);

  rpc WriteParams(stream ParamWrite) returns (WriteSummary);

  // Virtual devices. A device a client attaches appears in ListDevices/events like any
  // hot-plugged SDR. AttachDevice is the general form; the file RPCs are sugar over it.
  rpc AttachDevice(AttachDeviceRequest) returns (DeviceDescriptor);
  rpc DetachDevice(DetachDeviceRequest) returns (Empty);
  rpc AttachFileDevice(AttachFileDeviceRequest) returns (DeviceDescriptor);
  rpc DetachFileDevice(DetachFileDeviceRequest) returns (Empty);
}

message Empty {}
message ListDevicesRequest {}
message ListDevicesResponse { repeated DeviceDescriptor devices = 1; }
message GetStateRequest { EventScope scope = 1; }
message GetStateResponse {
  repeated DeviceDescriptor devices = 1;
  repeated Capture captures = 2;
  repeated Channel channels = 3;
  repeated Sink sinks = 4;
  uint64 event_seq = 5; // events after this seq are newer than this snapshot
  DaemonInfo daemon = 6;
  repeated Job jobs = 7;   // running and recently finished; reconnect renders these like the rest
}
message DaemonInfo {
  string version = 1;
  int64 pid = 2;
  int64 started_at_ns = 3;  // CLOCK_REALTIME
  string socket_path = 4;
}
message CreateCaptureRequest { string device_id = 1; uint64 center_hz = 2; uint64 sample_rate = 3; }
message DestroyCaptureRequest { string capture_id = 1; }
message CreateChannelRequest {
  string capture_id = 1; int64 offset_hz = 2; uint32 bandwidth_hz = 3;
  DemodMode mode = 4; bool persistent = 5; uint64 required_hz = 6;
}
message DestroyChannelRequest { string channel_id = 1; }
message AttachSinkRequest { string channel_id = 1; Sink sink = 2; } // sink_id ignored on input
message DetachSinkRequest { string sink_id = 1; }
// Sugar over AttachDevice with a FileSource; DetachFileDevice is sugar over DetachDevice.
message AttachFileDeviceRequest {
  // Filesystem path to <name>.cf32 (+ <name>.json sidecar). A ley://recordings/<id> URI is the
  // intended spelling once Resources can resolve one; today only a path is understood.
  string path = 1;
  bool loop = 2;     // wrap at EOF instead of ending the capture
}
message DetachFileDeviceRequest { string device_id = 1; }

// Where a virtual device's samples come from. Persistence follows intent: a file you play is
// ephemeral, a radio you attach is part of the station.
message DeviceSource {
  oneof source {
    FileSource file = 1;
    RtlTcpSource rtl_tcp = 2;
  }
}
// A recording played back as a device. Ephemeral: it lives until DetachDevice or daemon exit.
message FileSource {
  // Filesystem path to <name>.cf32 (+ <name>.json sidecar), as AttachFileDeviceRequest.path.
  string path = 1;
  bool loop = 2;     // wrap at EOF instead of ending the capture
}
// A dongle served by rtl_tcp on another machine. The daemon remembers the endpoint across
// restarts until DetachDevice forgets it.
message RtlTcpSource {
  string host = 1;
  uint32 port = 2;   // 1..65535; rtl_tcp's own default is 1234
}
message AttachDeviceRequest {
  // Attach connects once: a server that cannot be reached fails with DEVICE_IO naming
  // host:port and is remembered nowhere, because a radio never reached is usually a typo.
  // Attaching an rtl_tcp endpoint already hosted returns the existing descriptor rather than a
  // second device. A drop after that is DISCONNECTED and the daemon reconnects on its own.
  DeviceSource source = 1;
}
message DetachDeviceRequest {
  // Any device a client attached, file or rtl_tcp: it is closed, its captures end and it is
  // forgotten. A USB radio is refused with INVALID_ARGUMENT -- unplug it.
  string device_id = 1;
}
