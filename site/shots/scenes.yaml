# SPDX-License-Identifier: Apache-2.0
#
# The scenes `make shots` takes for leysdr.com (docs/plans/site-shots.md). go/cmd/leyshots reads
# this file: one scene per published image, named by its asset. Paths are relative to this
# directory. Every scene's alt text gets " Simulated signals." appended in shots.json.
#
# kind:
#   app        the Mac app, staged from `stage` and cropped to `crop` (macOS only)
#   terminal   `ley` in a tmux window of `terminal.cols` x `terminal.rows`, rendered as HTML and,
#              on macOS, as a PNG
#   table      a CSV drawn as a table in the terminal theme
#   composite  an app shot and a terminal shot from one daemon, side by side
#   icon       scripts/render-icon.swift (macOS only)
#
# fixtures are leyfix catalog entries, attached with `ley play --persistent --loop` in order, so
# the first one's channel is the one tuned when the app starts. rate and duration apply to a
# fixture outside the scenes set. clock is leylined --wall-clock; a scene whose terminal runs
# `ley track` may not set it, because `ley track --since` seeds from the real clock and a shifted
# daemon can open a track empty. steps run after the fixtures and before the shot: `ley` with the
# scene's socket and bookmarks, or `wait` seconds.
#
# ai: {script: assistant/x.script, provider: openai} runs the daemon's assistant on a scripted
# model with a made-up key, as a check scene's ai does (app/checks/scenes.yaml): nothing reaches a
# provider. speech: {script: net-speech.txt} makes the daemon's speech decoder leydec-speech's
# scripted engine, which replays the file's lines one an over, so `ley transcribe` and
# `ley watch speech` need no key and send nothing anywhere.
#
# app, on an app or composite scene, are commands sent to the running app over its command file
# once it is ready, in the check scenes' format (ax and relaunch excepted): the app is launched in
# the background and takes no focus, and the shot is the last snapshot's picture (window: settings
# takes the Settings window), cropped. A state expectation that fails fails the shot. Without app,
# the window is brought forward and taken with screencapture once its stage has settled. A
# composite's first pane is typed before the app starts unless it says after_app: true.
#
# A scene's daemon lists only the decoders a person's app lists (leylined --hide-test-decoders):
# not the test_only ones (iqstat, speech-scripted) its --no-hardware would show. With speech, the
# scripted engine stands in under speech's name. stage: {real_map: true} draws the Decoders map with MapKit's
# tiles, which a check scene never does; the app's own snapshot leaves the tiles out, so a scene
# that sets it is taken with screencapture (no app commands) after a settle long enough for them.

repo: reflexive-labs/leysdr

scenes:
  - asset: app-radio-2m.png
    kind: app
    alt: >-
      The Leyline window on the 2 m band: a voice transmission on 146.520 MHz with PL 100.0 in the
      inspector, the stations around it on the waterfall from 146.430 to 146.640 MHz, and the 2 m
      bookmarks in the sidebar.
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    bookmarks: home.csv
    # The fixture's own channel goes, so the window makes one of its own on the bookmark and
    # plays its audio, rather than following ley play's channel, whose sink is the terminal's.
    # The window's channel measures its squelch, which logs the transmissions and gives on_air a
    # squelch to wait on.
    steps:
      - ley: [stop, "146.52"]
    stage:
      window: {width: 1440, height: 820}
      place: radio
      inspector: true
      expanded_band: 2m
      select_bookmark: Calling
      settle: 40
      on_air: true
      zoom: 720000
    crop: {regions: [window]}

  - asset: sidebar-chirp-import.png
    kind: app
    alt: >-
      The Leyline sidebar after importing a CHIRP export of 100 memories: the 2 m band open with
      its five bookmarks, the other bands closed, and the import's counts in the notice over the
      waterfall.
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    stage:
      window: {width: 1440, height: 820}
      place: radio
      inspector: false
      expanded_band: 2m
      import_chirp: handheld.csv
      settle: 6
    # The import's notice is a line over the bottom of the waterfall, so the crop takes the
    # sidebar and the left of the charts down to it.
    crop: {regions: [sidebar, notice], size: {width: 760, height: 1000}, anchor: top-left}

  - asset: chirp-csv-before.png
    kind: table
    alt: >-
      The first rows of a CHIRP CSV export: memories across 2 m, 70 cm, GMRS, NOAA weather, MURS
      and marine, with their offsets and tones.
    table:
      source: handheld.csv
      rows: 24
      columns: [Location, Name, Frequency, Duplex, Offset, Tone, rToneFreq, cToneFreq, DtcsCode, Mode, Comment]
      width: 900

  - asset: inspector-tone.png
    kind: app
    alt: >-
      The Leyline inspector on the 146.940 MHz repeater output: the heard CTCSS tone, 127.3 Hz,
      beside the bookmark's tone, and each transmission in the log with its tone.
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    bookmarks: home.csv
    # The fixture's own channel goes, so the window makes one of its own on the bookmark and
    # plays its audio, rather than following ley play's channel, whose sink is the terminal's.
    # The window's channel measures its squelch, which logs the transmissions and gives on_air a
    # squelch to wait on.
    steps:
      - ley: [stop, "146.52"]
    stage:
      window: {width: 1440, height: 820}
      place: radio
      inspector: true
      expanded_band: 2m
      select_bookmark: Club repeater
      settle: 15
      on_air: true
    crop: {regions: [inspector]}

  - asset: inspector-dcs.png
    kind: app
    alt: >-
      The Leyline inspector on a net on 147.180 MHz: the heard DCS code, 023, beside the
      bookmark's tone.
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    bookmarks: home.csv
    # The fixture's own channel goes, so the window makes one of its own on the bookmark and
    # plays its audio, rather than following ley play's channel, whose sink is the terminal's.
    # The window's channel measures its squelch, which logs the transmissions and gives on_air a
    # squelch to wait on.
    steps:
      - ley: [stop, "146.52"]
    stage:
      window: {width: 1440, height: 820}
      place: radio
      inspector: true
      expanded_band: 2m
      select_bookmark: Evening net
      settle: 15
      on_air: true
    crop: {regions: [inspector]}

  - asset: scan-2m.png
    kind: terminal
    alt: >-
      ley scan 144M..148M in a terminal: a table of the carriers found on the 2 m band with their
      frequency, width, level over the floor, and how many looks saw each one.
    fixtures: [{name: scene_scan}]
    # A sweep will not take a radio a channel is on, and ley play leaves one.
    steps:
      - ley: [stop, all]
    terminal:
      cols: 120
      rows: 22
      panes:
        - command: ley scan 144M..148M
    settle: 10

  - asset: scan-app.png
    kind: app
    alt: >-
      The Leyline sidebar's 2 m band after Scan band: the carriers it found listed under the band
      with their level over the floor, and marked on the band rail.
    fixtures: [{name: scene_scan}]
    clock: "19:42"
    bookmarks: home.csv
    steps:
      - ley: [stop, all]
      # The file device tunes only its centre; the stage then tunes Calling inside that capture
      # and presses the row's Scan band, because the app shows the hits only of a scan it ran.
      - ley: [tune, "146", --persistent]
    stage:
      window: {width: 1440, height: 820}
      place: radio
      inspector: false
      expanded_band: 2m
      select_bookmark: Calling
      scan_band: true
      settle: 6
    # The hits are ticks on the band rail over the charts, so the crop takes the rail too.
    crop: {regions: [sidebar, waterfall], size: {width: 1000, height: 300}, anchor: top-left}

  - asset: library-net.png
    kind: app
    alt: >-
      The Leyline Library on a net recorded on 147.180 MHz: one part per over, with a level graph
      for each, and one part selected.
    fixtures: [{name: scene_net}]
    clock: "19:42"
    bookmarks: home.csv
    steps:
      - ley: [record, "147.18", --gate, squelch, --for, 170s, --detach]
      - wait: 175
    stage:
      window: {width: 1440, height: 820}
      place: library
      select_part: 0
      play_part: true
      settle: 4
    crop: {regions: [parts], size: {width: 2000, height: 460}, anchor: top-left}

  - asset: aprs-track.png
    kind: terminal
    alt: >-
      ley track aprs in a terminal: seven stations heard on 144.390 MHz with their positions,
      symbols and comments.
    fixtures: [{name: scene_aprs}]
    terminal:
      cols: 110
      rows: 16
      panes:
        - command: ley track aprs
    settle: 26

  - asset: ais-track.png
    kind: terminal
    alt: >-
      ley track ais in a terminal: five vessels heard on AIS channel 1, 161.975 MHz, with their
      positions.
    fixtures: [{name: scene_ais}]
    terminal:
      cols: 110
      rows: 14
      panes:
        - command: ley track ais
    settle: 25

  - asset: ways-app.png
    kind: app
    alt: >-
      Part of the Leyline window: the waterfall of the stations just above 146.520 MHz, beside the
      inspector on the Calling channel with its heard PL 100.0, signal and audio levels.
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    bookmarks: home.csv
    # The fixture's own channel goes, so the window makes one of its own on the bookmark and
    # plays its audio, rather than following ley play's channel, whose sink is the terminal's.
    # The window's channel measures its squelch, which logs the transmissions and gives on_air a
    # squelch to wait on.
    steps:
      - ley: [stop, "146.52"]
    stage:
      window: {width: 1440, height: 820}
      place: radio
      inspector: true
      select_bookmark: Calling
      settle: 25
      on_air: true
      zoom: 720000
    crop: {regions: [waterfall, inspector], size: {width: 760, height: 475}, anchor: top-right}

  - asset: ways-terminal.png
    kind: terminal
    alt: >-
      Two terminal panes: ley tune 146.52 showing the channel's meter, above ley set squelch -45
      changing the squelch on the same channel.
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    # ley stop leaves the radio tuned with no channel, so ley tune makes the one channel ley set
    # picks.
    steps:
      - ley: [stop]
    terminal:
      cols: 90
      rows: 34
      split: vertical
      panes:
        # Three seconds in: typed at once, the tune landed between two overs and said nothing
        # was above the noise.
        - command: ley tune 146.52
          delay: 3
        - command: ley set squelch -45
          delay: 4
    settle: 8

  - asset: ways-sync.png
    kind: composite
    alt: >-
      The Leyline window and a terminal side by side on one daemon: the squelch set from ley
      shows in the app's inspector.
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    # As in ways-terminal, the first pane's ley tune is the one channel. It is typed before the app
    # starts, so the app opens on it, and the squelch change is typed once the app is showing.
    steps:
      - ley: [stop]
    stage:
      window: {width: 1100, height: 700}
      place: radio
      inspector: true
      expanded_band: 2m
      settle: 10
    crop: {regions: [window]}
    terminal:
      cols: 90
      rows: 24
      split: vertical
      panes:
        # Three seconds in: typed at once, the tune landed between two overs and said nothing
        # was above the noise.
        - command: ley tune 146.52
          delay: 3
        - command: ley set squelch -45
          delay: 4
    settle: 8

  # The assistant on a scripted model (ai, as the check scenes' is): nothing reaches a provider,
  # and the key is a made-up one in the scene daemon's own data. The app is driven over its
  # command file, so the request is typed into the column as a person types it.
  - asset: app-assistant.png
    kind: app
    alt: >-
      The Leyline window with the assistant beside the inspector: a request to put on the weather
      radio, the two steps it ran, listing the presets and tuning WX2, and its reply naming the
      channel, which the window has moved to.
    fixtures: [{name: scene_wx_on}]
    clock: "19:42"
    # The seven NOAA channels as NFM bookmarks, the mode tune chooses there, so the window's
    # channel matches its bookmark.
    bookmarks: weather.csv
    ai: {script: assistant/weather.script, provider: openai}
    # The fixture's own channel goes, so the window makes one of its own on WX3 and has its audio.
    steps:
      - ley: [stop, "162.4"]
    stage:
      window: {width: 1440, height: 820}
      place: radio
      inspector: true
      select_bookmark: WX3
      assistant: true
      # The waterfall's history.
      settle: 25
    app:
      - {cmd: press, identifier: assistant.input}
      - {cmd: type, text: put on the weather radio}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 5}
      - {cmd: state, expect: {assistant.state: ready, tuned_hz: 162400000}}
      - {cmd: snapshot, name: shot, settle: 2}
    crop: {regions: [window]}

  - asset: app-assistant-ask.png
    kind: app
    alt: >-
      The assistant's column asking before it takes the radio from a ley command: the request, the
      tune that failed because the radio was in use, and the question with Decline, Allow in this
      chat and Allow.
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    bookmarks: home.csv
    ai: {script: assistant/takeover.script, provider: openai}
    stage:
      window: {width: 1440, height: 820}
      place: radio
      inspector: true
      select_bookmark: Calling
      assistant: true
      settle: 3
    app:
      - {cmd: press, identifier: assistant.input}
      - {cmd: type, text: put on the weather radio}
      - {cmd: key, keys: return}
      - {cmd: wait, seconds: 4}
      - {cmd: state, expect: {assistant.state: waiting for you}}
      - {cmd: snapshot, name: shot, settle: 1}
    # The column is the window's right edge, under the toolbar.
    crop: {regions: [window], size: {width: 320, height: 400}, anchor: bottom-right}

  # Settings, AI with a made-up OpenAI key; a `ley ask` of the scripted assistant gives the usage
  # table its one row.
  - asset: settings-ai.png
    kind: app
    alt: >-
      Leyline's Settings, AI: an OpenAI key, shown by its last four characters, the models the
      assistant and speech use with what each sends to api.openai.com, and the requests and tokens
      the assistant used today.
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    bookmarks: home.csv
    ai: {script: assistant/usage.script, provider: openai}
    steps:
      - ley: [ask, --yes, "what is the radio on"]
    stage:
      window: {width: 1440, height: 820}
      place: radio
      settle: 3
      settings: true
    app:
      - {cmd: snapshot, name: shot, window: settings, settle: 1}
    # The pane runs past the window's foot; the crop ends under the usage table's one row, above
    # the total the window cuts in half.
    crop: {regions: [window], size: {width: 680, height: 714}}

  # The net recorded gated, then transcribed by the speech decoder, which here is the scripted
  # engine replaying net-speech.txt (speech): no key, nothing sent anywhere.
  - asset: library-speech.png
    kind: app
    alt: >-
      The Leyline Library on a net recorded on 147.180 MHz and transcribed: the words of each over
      under its part, and one part selected.
    fixtures: [{name: scene_net}]
    clock: "19:42"
    bookmarks: home.csv
    speech: {script: net-speech.txt}
    steps:
      - ley: [record, "147.18", --gate, squelch, --for, 170s, --detach]
      - wait: 175
      - ley: [transcribe, job_, --yes]
    stage:
      window: {width: 1440, height: 820}
      place: library
      select_part: 0
      play_part: true
      # The scripted engine's `scripted · 100%` would claim a model ran.
      hide_engine_label: true
      settle: 4
    app:
      - {cmd: snapshot, name: shot}
    crop: {regions: [parts], size: {width: 2000, height: 700}, anchor: top-left}

  # The window follows a terminal: the fixture's channel goes, the window makes its own on
  # Calling, and `ley tune 146.940 --bw 25` is typed once the window shows. The width is the Club
  # repeater bookmark's (CHIRP's FM, NFM at 25 kHz); tuned at the 2 m default of 12.5 kHz the
  # inspector would read the bookmark as changed.
  - asset: app-follow-terminal.png
    kind: composite
    alt: >-
      A terminal running ley tune 146.940 --bw 25 beside the Leyline window, which has moved to the
      club repeater on 146.940 MHz, says another terminal tuned it and that the audio plays there.
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    bookmarks: home.csv
    steps:
      - ley: [stop, "146.52"]
    stage:
      window: {width: 1100, height: 700}
      place: radio
      inspector: true
      select_bookmark: Calling
      # The waterfall's history before the tune.
      settle: 20
    terminal:
      cols: 80
      rows: 24
      panes:
        - command: ley tune 146.940 --bw 25
          after_app: true
    settle: 4
    app:
      - {cmd: state, expect: {tuned_hz: 146940000}}
      # The tune lands just after an over; the repeater's next one is on the air by now.
      - {cmd: wait, seconds: 5}
      - {cmd: snapshot, name: shot}
    crop: {regions: [window]}

  - asset: ley-ai.png
    kind: terminal
    alt: >-
      ley ai in a terminal: one OpenAI key shown by its last four characters, never used and
      accepted by the provider, and the provider and model the assistant and speech use.
    fixtures: [{name: scene_2m}]
    clock: "19:42"
    # No ley ask first, so the key reads never used. A use would be dated by the daemon's
    # --wall-clock as CHECKED is, so one could be added.
    ai: {script: assistant/usage.script, provider: openai}
    terminal:
      cols: 100
      rows: 14
      panes:
        - command: ley ai
    settle: 3

  # ley watch speech on the net, the speech decoder the scripted engine (speech).
  - asset: ley-watch-speech.png
    kind: terminal
    alt: >-
      ley watch speech in a terminal on a 2 m net: only the overs whose words include "net
      control", each with its time, part and words.
    fixtures: [{name: scene_net}]
    clock: "19:42"
    speech: {script: net-speech.txt}
    # The speech decoder has no frequency of its own, so the watch names the net's.
    terminal:
      cols: 110
      rows: 14
      panes:
        - command: ley watch speech --freq 147.18 --where 'text~net control'
    # The whole 163 s net, whose overs the decoder writes up as each ends.
    settle: 170

  # The Decoders place on scene_adsb, as the check scene decoders-adsb reaches it: 150 records
  # from the five aircraft, about seven seconds of their traffic, so each has sent the
  # identification that names it, then the job cancelled so the counts stand still. real_map
  # draws MapKit's tiles, as a person sees them, where a check scene's map is a plain canvas.
  # The app's own picture (a snapshot) leaves out what Metal draws, MapKit's tiles among them, so
  # the scene has no app commands and the window is taken with screencapture; SwiftUI's Map says
  # nothing when its tiles have loaded, so settle gives them time.
  - asset: app-decoders-map.png
    kind: app
    alt: >-
      The Leyline Decoders place on Aircraft: five aircraft by callsign on a map of the San
      Francisco Bay Area, each turned to its track, and LEY303 selected, its position, altitude
      and every field it sent in the inspector with their units.
    fixtures: [{name: scene_adsb}]
    clock: "19:42"
    steps:
      - ley: [decode, adsb, --job, --count, "150"]
      - ley: [jobs, cancel, job_]
    stage:
      window: {width: 1440, height: 820}
      place: decoders
      inspector: true
      decoder: aircraft
      decoder_tab: map
      select_transmitter: A1F003
      real_map: true
      settle: 15
    crop: {regions: [window]}

  - asset: app-decoders-table.png
    kind: app
    alt: >-
      The Leyline Decoders place on Aircraft as a table: the five aircraft by callsign, with
      their altitude, ground speed, track and squawk, and when each was last heard.
    fixtures: [{name: scene_adsb}]
    clock: "19:42"
    steps:
      - ley: [decode, adsb, --job, --count, "150"]
      - ley: [jobs, cancel, job_]
    stage:
      window: {width: 1440, height: 820}
      place: decoders
      inspector: true
      decoder: aircraft
      decoder_tab: table
      select_transmitter: A1F003
      settle: 2
    app:
      - {cmd: state, expect: {place: decoders, decoders.decoder: adsb, decoders.tab: table}}
      - {cmd: snapshot, name: shot}
    crop: {regions: [window]}

  # APRS from the Radio, as the check scene radio-decoding reaches it: a terminal starts APRS as
  # a kept job on the window's capture once the window shows, and each station heard since puts
  # its callsign on the waterfall row it was heard in. The stations send one every 3 s. ley
  # exits after the first packet; the kept job runs on.
  - asset: app-waterfall-names.png
    kind: app
    alt: >-
      The Leyline window on 144.390 MHz with the APRS decoder running: the callsigns of the
      stations it decoded on the waterfall rows they were heard in, and APRS's row at the top of
      the sidebar.
    fixtures: [{name: scene_aprs}]
    clock: "19:42"
    stage:
      window: {width: 1440, height: 820}
      place: radio
      inspector: true
      expanded_band: 2m
      settle: 3
    app:
      - {cmd: ley, args: [decode, aprs, --job, --count, "1"]}
      - {cmd: wait, seconds: 20, expect_log: "tag N0CALL-[1-7] at 144390000 Hz"}
      - {cmd: state, expect: {decoding_rows.0.decoder: aprs, waterfall_tags.0.hz: 144390000}}
      - {cmd: snapshot, name: shot}
    crop: {regions: [window]}

  # The question before a person's move pauses a job, as the check scene retune-asks reaches it:
  # Scan band on 2 m with a terminal's APRS job on the window's radio. Decoders' "Take the
  # radio?" is the same question from the other side, but it asks only when Start would retune
  # the radio, and a file radio tunes only where it was recorded, so no fixture reaches it.
  - asset: app-move-radio.png
    kind: app
    alt: >-
      The Leyline window asking "Move the radio?" before Scan band on 2 m, because the sweep
      pauses the APRS decoder on 144.390 MHz, with Sweep anyway and Cancel.
    fixtures: [{name: scene_aprs}]
    clock: "19:42"
    stage:
      window: {width: 1440, height: 820}
      place: radio
      inspector: true
      expanded_band: 2m
      settle: 3
    app:
      - {cmd: ley, args: [decode, aprs, --job, --count, "1"]}
      - {cmd: wait, seconds: 8}
      - {cmd: state, expect: {tuned_hz: 144390000, decoding_rows.0.decoder: aprs, alert: null}}
      - {cmd: press, identifier: sidebar.band.2m.scan}
      - {cmd: wait, seconds: 1, expect_log: "asked before scan .*: This pauses the APRS decoder on 144.390 MHz."}
      - {cmd: state, expect: {alert.title: "Move the radio?", alert.message: "This pauses the APRS decoder on 144.390 MHz."}}
      - {cmd: snapshot, name: shot}
    crop: {regions: [window]}

  # --dry-run from the scene's daemon, APRS running as a kept job: a second APRS job would share
  # its capture. A file radio tunes only where it was recorded, so a dry run that retunes, or one
  # that declines, would show the harness ("a file radio plays what it recorded") rather than what
  # a person with a dongle sees.
  - asset: ley-dry-run.png
    kind: terminal
    alt: >-
      ley decode aprs --dry-run in a terminal with the APRS decoder already running: it would
      share the capture at 144.390 MHz and retune nothing.
    fixtures: [{name: scene_aprs}]
    clock: "19:42"
    steps:
      - ley: [decode, aprs, --job, --count, "1"]
    terminal:
      cols: 90
      rows: 6
      panes:
        - command: ley decode aprs --dry-run
          delay: 1
    settle: 3

  - asset: app-icon-1024.png
    kind: icon
    alt: The Leyline app icon.
