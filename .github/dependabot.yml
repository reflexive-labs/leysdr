# Weekly update pull requests, grouped per ecosystem so a week is one PR each. Generated code
# (go/gen, swift/LeylineProto) is regenerated by `make proto` after a protobuf or gRPC bump, and
# CI's drift checks fail until it is.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: swift
    directories:
      - /engine
      - /app
      - /swift/LeylineProto
    schedule:
      interval: weekly
    groups:
      swift:
        patterns: ["*"]
