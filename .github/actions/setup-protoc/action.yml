# SPDX-License-Identifier: Apache-2.0
name: setup-protoc
description: >-
  Install a pinned protoc release from GitHub, checked against a recorded SHA-256. A composite
  action, so it runs no JavaScript and does not depend on a Node runtime.
inputs:
  version:
    description: protoc release, without the leading v. The checksums below are for this version.
    default: "25.1"
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        version='${{ inputs.version }}'
        case "$RUNNER_OS-$(uname -m)" in
          Linux-x86_64) asset=linux-x86_64; sum=ed8fca87a11c888fed329d6a59c34c7d436165f662a2c875246ddb1ac2b6dd50 ;;
          macOS-arm64)  asset=osx-aarch_64; sum=320308ce18c359564948754f51748de41cf02a4e7edf0cf47a805b9d38610f16 ;;
          *) echo "::error::no recorded protoc checksum for $RUNNER_OS-$(uname -m)"; exit 1 ;;
        esac
        if [ "$version" != "25.1" ]; then
          echo "::error::the checksums in this action are for protoc 25.1; record new ones for $version"
          exit 1
        fi
        zip="$RUNNER_TEMP/protoc.zip"
        curl -fsSL --retry 3 -o "$zip" \
          "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-$asset.zip"
        echo "$sum  $zip" | shasum -a 256 -c -
        unzip -q -o "$zip" -d "$RUNNER_TEMP/protoc"
        echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/protoc/bin/protoc" --version
