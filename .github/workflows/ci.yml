name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its running checks; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proto-and-go:
    name: proto validation + Go clients
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # Only protoc comes from outside the repo; scripts/gen-proto.sh installs the Go plugins from
      # go/go.mod's tool directives, so the drift check is against the pinned plugin versions.
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: generated Go code is current
        run: |
          ./scripts/gen-proto.sh
          git diff --exit-code -- go/gen
      # Swift has no link-time -X, so the engine's version constant is generated and checked in.
      - name: the version is one number in three places
        run: make version-check
      # SPDX headers on every source file, the dependency manifest equal to go.mod's graph and
      # engine/Package.resolved, and no copyleft imported outside engine/ (docs/decisions/D2-licensing.md).
      - name: licences
        run: make license-check
      - name: go.mod / go.sum are tidy
        working-directory: go
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: build, vet, test
        working-directory: go
        run: |
          go build ./...
          go vet ./...
          go test ./...
      - name: race detector (the verbs' streaming goroutines)
        run: make race
      - name: lint (pinned golangci-lint + gofumpt)
        run: make lint

  swift-linux:
    name: engine on Linux (compile + portable DSP tests + contract e2e)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: build + test without SDR host libraries (portable DSP kernels, optional-loader matrix, fixture round-trips)
        run: make swift swift-test
      - name: cross-language e2e (ley driving the Linux-built leylined)
        run: make e2e
      # The app's client façade is plain Swift over the generated contract, so it builds and is
      # tested here too; the SwiftUI target is declared only on macOS.
      - name: app façade (unit tests, then against the Linux-built leylined)
        run: make app-test app-e2e

  swift-macos:
    name: engine on macOS (the product)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: build + test without SDR host libraries (Accelerate kernels, optional-loader matrix, fixture round-trips)
        run: make swift swift-test
      # The Go clients and the UDS contract were proven only on Linux before this step; macOS is
      # the platform the product ships on, so `ley` and the cross-language e2e run here too.
      - name: Go clients, lint, and ley driving the macOS-built leylined
        run: make go-test lint e2e
      # The Mac app: the SwiftUI target compiles only here, the façade's tests run against the
      # macOS-built daemon, and the bundle script proves the layout (ad-hoc signed; notarization
      # is the release checklist's step).
      - name: Mac app (build, façade tests, bundle)
        run: make app app-test app-e2e app-bundle
      # Swift generation drift. The Go job proves go/gen is current; nothing else regenerates
      # LeylineProto, so a proto change that only regenerated Go would otherwise pass. The script
      # builds the Swift plugins from swift/LeylineProto/Package.resolved and the Go ones from
      # go/go.mod.
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: generated Swift code is current
        run: |
          REQUIRE_SWIFT=1 ./scripts/gen-proto.sh
          git diff --exit-code -- swift/LeylineProto/Sources go/gen
